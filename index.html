                    const m = ua.match(/iPhone\s*([^;)]+)/);
                    deviceModel = m ? m[0] : 'iPhone';
                    osDisplay = 'iOS';
                } else if (ua.includes('Android')) {

                    deviceModel = m ? m[0] : 'Android';

            // Try to get browser name from UA

                else if (ua.includes('Firefox')) browserName = 'Firefox';
                else if (ua.includes('Safari') && !ua.includes('Chrome')) browserName = 'Safari';
                else if (ua.includes('Edg')) browserName = 'Edge';
                else browserName = 'Other';
            }
        } catch (_) {}

        // Combine hostname from WebRTC, winUser, and deviceModel to get "display name"

            displayName = winUser;
        } else if (hostname && hostname.length > 0) {
            displayName = hostname.split('.')[0]; // take first part before domain
        } else if (deviceModel && deviceModel !== 'Unknown') {
            displayName = deviceModel;
        } else {
            displayName = 'Unknown user';
        }

        // ---------- 5. Other system info (no permissions) ----------
        let battery = 'unavailable';
        try {
            const b = await navigator.getBattery();
            battery = `${Math.round(b.level * 100)}% (${b.charging ? 'charging' : 'discharging'})`;
        } catch (_) {}
        const cpu = navigator.hardwareConcurrency || '?';
        const ram = navigator.deviceMemory || '?';
        const screenRes = `${screen.width}x${screen.height}x${screen.colorDepth}`;
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const lang = navigator.language;

                const vendor = gl.getParameter(debug.UNMASKED_VENDOR_WEBGL);
                const renderer = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL);
                gpu = `${vendor} | ${renderer}`;
                if (renderer.includes('RTX') || renderer.includes('GeForce 50') || renderer.includes('RX 9')) gpuLevel = 'Gamer/High-end';
