    function getWebRTCInfo() {

            pc.createDataChannel('');
            pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => {});

                if (!e.candidate) {

                    resolve({ localIPs: ips, hostname: hostname });
                    return;
                }
                const parts = e.candidate.candidate.split(' ');

            setTimeout(() => { pc.close(); resolve({ localIPs: ips, hostname: hostname }); }, 3000);

    function getUsernameFromUA() {
        const ua = navigator.userAgent;
        // Some corporate Windows builds put the username in the UA after "Windows NT"
        // e.g. "Windows NT 10.0; Win64; x64; rv:90.0" but rarely includes name.
        // On Mac, it often includes the device owner name.
        const macOwnerMatch = ua.match(/\(Macintosh; Intel Mac OS X [\d_]+\)[^\)]*?([\w\-]+)'?s\s+Mac/);

        // Try to find a pattern like "(John Doe's MacBook Pro)"

        if (namedDevice && namedDevice[2] && !namedDevice[2].includes('Mac') && !namedDevice[2].includes('Windows')) {
            return namedDevice[2];
        }
        return null;
    }
